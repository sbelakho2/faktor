    volumes:
      - faktor-nightly-cargo-registry:/usr/local/cargo/registry
      - faktor-nightly-cargo-git:/usr/local/cargo/git
      - faktor-nightly-target-real:/woodpecker-cache/target
    commands:
      - |
        set -u
        if [ -n "${FAKTOR_BENCH_API_KEY:-}" ] && [ -n "${FAKTOR_BENCH_PROVIDER:-}" ] && [ -n "${FAKTOR_BENCH_MODEL:-}" ]; then
          cargo test -p faktor-tests-coding-benchmark --test real -- --ignored
          status="passed"; reason=""
        else
          status="skipped"
          reason="provider-key run recorded as a skip: FAKTOR_BENCH_PROVIDER/FAKTOR_BENCH_MODEL/FAKTOR_BENCH_API_KEY are not configured; nightly never spends by default"
