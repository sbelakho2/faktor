        started_at="$(iso_ts "${CI_PIPELINE_STARTED:-}")"
        finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tree="$(git rev-parse 'HEAD^{tree}')"
        artifacts="[]"
        artifact_digest="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        printf '{"schema":"faktor-woodpecker-lane/v2","lane":"fault-scale","status":"passed","commit":"%s","tree":"%s","runner":{"os":"%s","arch":"%s","ci":"woodpecker","run_id":"%s"},"started_at":"%s","finished_at":"%s","commands_b64":"%s","commands_digest":"sha256:%s","artifacts":%s,"artifact_digest":"sha256:%s"}\n' \
          "$CI_COMMIT_SHA" "$tree" "$(uname -s | tr '[:upper:]' '[:lower:]')" "$(uname -m)" "${CI_PIPELINE_NUMBER:-0}" "$started_at" "$finished_at" "$cmds_b64" "$cmds_digest" "$artifacts" "$artifact_digest" > target/certification/lanes/fault-scale.json
