# Faktor CI — nightly campaign (Woodpecker cron event, job name `nightly`).
#
# REGISTRATION: a cron workflow only runs after the matching cron job exists
# in the repository settings. Register it with
#   bash scripts/woodpecker/activate.sh <owner/repo> --run-now
# or via the API `POST /api/repos/{repo_id}/cron` with
#   {"name":"nightly","schedule":"0 3 * * *","branch":"main","timezone":"UTC","enabled":true}
# (or Repository Settings → Cron Jobs in the UI). See setup.md §6.
#
# STORAGE POLICY: cron events are trusted (server-owned, default-branch
# config), so this workflow uses its own `faktor-nightly-*` named volumes.
# It never mounts the `faktor-trusted-*` caches, and `pr.yaml` never mounts
# these. Every lane has its own target volume so the parallel cargo invocations
# do not fight over a target-dir lock.
#
# Coverage: [fault] campaigns at scale, the longrun suite (release), the
# efficiency harness, the economy suite, the coding-benchmark smoke, the
# provider-key real-model run (recorded as an explicit skip unless keys are
# supplied out-of-band — CI requires NO secrets by default), and the
# supply-chain evidence job (missing advisory tools stay loud recorded skips
# inside target/certification/supply-chain-status.json).
#
# Timeout: Woodpecker has no per-step timeout; the repository pipeline timeout
# applies (default 60 min, max settable 120 min). Raise it (setup.md §6):
#   server:  WOODPECKER_MAX_PIPELINE_TIMEOUT=1560
#   repo:    PATCH /api/repos/{repo_id} {"timeout":1560}
# Commit-status context (default format): ci/woodpecker/cron/nightly

labels:
  platform: linux/amd64

when:
  - event: cron
    cron: nightly

steps:
  # ---------------------------------------------------------- kilo-compat --
  # REQUIRED (additive to the campaign set): unmodified @kilocode/sdk@7.5.6
  # replay against a real daemon with Node >= 22.15 installed explicitly.
  # FAKTOR_COMPAT_REQUIRE_NODE=1 makes a missing Node fatal and records
  # status=failed in target/certification/kilo-compat.json. The v2 marker is
  # a dependency of certificate-nightly.
  - name: kilo-compat
    image: rust:1.98
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
      FAKTOR_COMPAT_REQUIRE_NODE: "1"
    volumes:
      - faktor-nightly-cargo-registry:/usr/local/cargo/registry
      - faktor-nightly-cargo-git:/usr/local/cargo/git
      - faktor-nightly-target-kilo-compat:/woodpecker-cache/target
    commands:
      - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gnupg
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y --no-install-recommends nodejs
      - node --version
      - cargo test -p faktor-tests-compat --lib unmodified_upstream_client
      - |
        node -e '
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("target/certification/kilo-compat.json", "utf8"));
          if (report.schema !== "faktor-kilo-compat/v1") throw new Error("kilo-compat report schema " + report.schema);
          if (report.commit !== process.env.CI_COMMIT_SHA) throw new Error("kilo-compat report commit " + report.commit + " != " + process.env.CI_COMMIT_SHA);
          if (report.status !== "passed" && report.status !== "partial") throw new Error("kilo-compat report status " + report.status);
          if (report.status === "passed" && report.responses.passed !== report.responses.total) throw new Error("kilo-compat status/ratio mismatch");
          console.log("kilo-compat: requests " + report.requests.passed + "/" + report.requests.total + ", responses " + report.responses.passed + "/" + report.responses.total + ", divergences " + report.required_divergences + " (" + report.status + ")");
        '
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gnupg
        curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y --no-install-recommends nodejs
        node --version
        cargo test -p faktor-tests-compat --lib unmodified_upstream_client
        node -e '
        const fs = require("node:fs");
        const report = JSON.parse(fs.readFileSync("target/certification/kilo-compat.json", "utf8"));
        if (report.schema !== "faktor-kilo-compat/v1") throw new Error("kilo-compat report schema " + report.schema);
        if (report.commit !== process.env.CI_COMMIT_SHA) throw new Error("kilo-compat report commit " + report.commit + " != " + process.env.CI_COMMIT_SHA);
        if (report.status !== "passed" && report.status !== "partial") throw new Error("kilo-compat report status " + report.status);
        if (report.status === "passed" && report.responses.passed !== report.responses.total) throw new Error("kilo-compat status/ratio mismatch");
        console.log("kilo-compat: requests " + report.requests.passed + "/" + report.requests.total + ", responses " + report.responses.passed + "/" + report.responses.total + ", divergences " + report.required_divergences + " (" + report.status + ")");
        '
        CMDS
        )"
        cmds_digest="sha256:$(printf '%s' "$CMDS" | sha256sum | cut -d' ' -f1)"
        cmds_b64="$(printf '%s' "$CMDS" | base64 | tr -d '\n')"
        iso_ts() { t="$1"; if [ -n "$t" ]; then date -u -r "$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ; else date -u +%Y-%m-%dT%H:%M:%SZ; fi; }
        started_at="$(iso_ts "${CI_PIPELINE_STARTED:-}")"
        finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tree="$(git rev-parse 'HEAD^{tree}')"
        artifacts="[]"
        artifact_digest="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        printf '{"schema":"faktor-woodpecker-lane/v2","lane":"kilo-compat","status":"passed","commit":"%s","tree":"%s","runner":{"os":"%s","arch":"%s","ci":"woodpecker","run_id":"%s"},"started_at":"%s","finished_at":"%s","commands_b64":"%s","commands_digest":"sha256:%s","artifacts":%s,"artifact_digest":"sha256:%s"}\n' \
          "$CI_COMMIT_SHA" "$tree" "$(uname -s | tr '[:upper:]' '[:lower:]')" "$(uname -m)" "${CI_PIPELINE_NUMBER:-0}" "$started_at" "$finished_at" "$cmds_b64" "$cmds_digest" "$artifacts" "$artifact_digest" > target/certification/lanes/kilo-compat.json
