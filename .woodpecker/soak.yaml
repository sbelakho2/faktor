# Faktor CI — soak campaign (Woodpecker cron event, job name `soak`).
#
# REGISTRATION: a cron workflow only runs after the matching cron job exists
# in the repository settings. Register it with
#   bash scripts/woodpecker/activate.sh <owner/repo> --run-now
# or via the API `POST /api/repos/{repo_id}/cron` with
#   {"name":"soak","schedule":"0 4 * * 6","branch":"main","timezone":"UTC","enabled":true}
# (or Repository Settings → Cron Jobs in the UI). See setup.md §6.
#
# TIMEOUT (required): Woodpecker has no per-step timeout, and the default
# repository pipeline timeout is 60 minutes (max settable 120). The 24h
# wall-clock run therefore needs BOTH:
#   server: WOODPECKER_MAX_PIPELINE_TIMEOUT=1560   (26h; server/agent env)
#   repo:   PATCH /api/repos/{repo_id} {"timeout":1560}
# On hosted woodpecker-ci.org the server-side cap is fixed: the longrun-24h
# lane can only run on a self-hosted instance where the cap was raised, and
# it stays a recorded non-run otherwise (setup.md §6).
#
# STORAGE POLICY: cron events are trusted, so this workflow may use its own
# `faktor-soak-*` named volumes. It never mounts `faktor-trusted-*`
# (trusted.yaml) or `faktor-nightly-*` (nightly.yaml), and `pr.yaml` never
# mounts these.
#
# Coverage: the [soak] 12h synthetic session (tests/soak, skew-safe) and the
# [soak] 24h zero-drift wall-clock certification (tests/longrun).
# Commit-status context (default format): ci/woodpecker/cron/soak

labels:
  platform: linux/amd64

when:
  - event: cron
    cron: soak

steps:
  # ----------------------------------------------------------- soak-scale --
  # [soak] 12-hour synthetic session (time-skewed, bounded).
  - name: soak-scale
    image: rust:1.98
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
    volumes:
      - faktor-soak-cargo-registry:/usr/local/cargo/registry
      - faktor-soak-cargo-git:/usr/local/cargo/git
      - faktor-soak-target-scale:/woodpecker-cache/target
    commands:
      - cargo test -p faktor-tests-soak --release -- --ignored
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cargo test -p faktor-tests-soak --release -- --ignored
        CMDS
        )"
        cmds_digest="sha256:$(printf '%s' "$CMDS" | sha256sum | cut -d' ' -f1)"
        cmds_b64="$(printf '%s' "$CMDS" | base64 | tr -d '\n')"
        iso_ts() { t="$1"; if [ -n "$t" ]; then date -u -r "$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ; else date -u +%Y-%m-%dT%H:%M:%SZ; fi; }
        started_at="$(iso_ts "${CI_PIPELINE_STARTED:-}")"
        finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tree="$(git rev-parse 'HEAD^{tree}')"
        artifacts="[]"
        artifact_digest="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        printf '{"schema":"faktor-woodpecker-lane/v2","lane":"soak-scale","status":"passed","commit":"%s","tree":"%s","runner":{"os":"%s","arch":"%s","ci":"woodpecker","run_id":"%s"},"started_at":"%s","finished_at":"%s","commands_b64":"%s","commands_digest":"sha256:%s","artifacts":%s,"artifact_digest":"sha256:%s"}\n' \
          "$CI_COMMIT_SHA" "$tree" "$(uname -s | tr '[:upper:]' '[:lower:]')" "$(uname -m)" "${CI_PIPELINE_NUMBER:-0}" "$started_at" "$finished_at" "$cmds_b64" "$cmds_digest" "$artifacts" "$artifact_digest" > target/certification/lanes/soak-scale.json
  - name: longrun-24h
    image: rust:1.98
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
    volumes:
      - faktor-soak-cargo-registry:/usr/local/cargo/registry
      - faktor-soak-cargo-git:/usr/local/cargo/git
      - faktor-soak-target-longrun:/woodpecker-cache/target
    commands:
      - cargo test -p faktor-tests-longrun --release -- --ignored
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cargo test -p faktor-tests-longrun --release -- --ignored
        CMDS
        )"
        cmds_digest="sha256:$(printf '%s' "$CMDS" | sha256sum | cut -d' ' -f1)"
        cmds_b64="$(printf '%s' "$CMDS" | base64 | tr -d '\n')"
        iso_ts() { t="$1"; if [ -n "$t" ]; then date -u -r "$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ; else date -u +%Y-%m-%dT%H:%M:%SZ; fi; }
        started_at="$(iso_ts "${CI_PIPELINE_STARTED:-}")"
        finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tree="$(git rev-parse 'HEAD^{tree}')"
        artifacts="[]"
        artifact_digest="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        printf '{"schema":"faktor-woodpecker-lane/v2","lane":"longrun-24h","status":"passed","commit":"%s","tree":"%s","runner":{"os":"%s","arch":"%s","ci":"woodpecker","run_id":"%s"},"started_at":"%s","finished_at":"%s","commands_b64":"%s","commands_digest":"sha256:%s","artifacts":%s,"artifact_digest":"sha256:%s"}\n' \
          "$CI_COMMIT_SHA" "$tree" "$(uname -s | tr '[:upper:]' '[:lower:]')" "$(uname -m)" "${CI_PIPELINE_NUMBER:-0}" "$started_at" "$finished_at" "$cmds_b64" "$cmds_digest" "$artifacts" "$artifact_digest" > target/certification/lanes/longrun-24h.json
  - name: certificate-soak
    image: node:24
    depends_on:
      - soak-scale
      - longrun-24h
    when:
      status: [success, failure]
    commands:
      - node scripts/certification/evidence.mjs verify-markers --workflow soak --lanes-dir target/certification/lanes --out target/certification/ci-certification.json --pipeline-status "$CI_PIPELINE_STATUS" --run-id "$CI_PIPELINE_NUMBER"
      - node scripts/certification/evidence.mjs write --kind real_soak --status passed --from-markers target/certification/lanes --commands "wall-clock soak lanes at this commit"
      - node scripts/certification/evidence.mjs write --kind ci_certification_soak --status passed --from-markers target/certification/lanes --commands "woodpecker soak campaign certificate"