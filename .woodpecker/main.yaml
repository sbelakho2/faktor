# Faktor main-branch CI — CHANGE-SCOPED ONLY (single-maintainer policy).
#
# Direct pushes to main are expected. This lane never runs the whole test
# suite for a partial change: `scripts/programme/ci-scope.mjs` maps the push
# diff to the EXACT workspace package names (read from each member's
# Cargo.toml), selects bounded docs/apps/site/programme/mutation/separation
# checks, and writes one script per toolchain. The mapping is selftested here
# with planted docs/apps/site/programme, deleted/renamed, base-fallback and
# unmappable-path cases. An unmappable path is a typed failure (exit 3), not
# an empty selection. Pull-request gating is not required and branch
# protection must remain off for this single-person repository.
when:
  - event: push
    branch: main

labels:
  platform: linux/amd64

steps:
  - name: scope
    image: node:24-trixie@sha256:016f604a11c4c725f0a4c62e29ff11adab153d297bf97046c9bf2ddb9f1011d3 # node:24-trixie @ 2026-10-24
    environment:
      RUST_BACKTRACE: "1"
    commands:
      - node scripts/programme/ci-scope.mjs --selftest
      - |
        set -eu
        base="${CI_COMMIT_BEFORE_SHA:-}"
        node scripts/programme/ci-scope.mjs --plan --base "$base"
      - cat target/certification/ci/plan.json

  # Rust half: one workspace type-check (cross-crate effects) plus fmt,
  # clippy and tests only for crates whose own files changed. A manifest-only
  # change compiles the workspace and runs no whole-workspace test command.
  - name: rust-scope
    depends_on: [scope]
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24
    environment:
      RUST_BACKTRACE: "1"
    commands:
      - rustup component add rustfmt clippy
      - sh target/certification/ci/scope-rust.sh

  # Node half: docs, programme registry/selector, mutation/separation static
  # gates and the zero-JavaScript website scan. The script is a no-op when
  # the diff selected none of these scopes.
  - name: node-scope
    depends_on: [scope]
    image: node:24-trixie@sha256:016f604a11c4c725f0a4c62e29ff11adab153d297bf97046c9bf2ddb9f1011d3 # node:24-trixie @ 2026-10-24
    commands:
      - sh target/certification/ci/scope-node.sh

  - name: vscode-scope
    depends_on: [scope]
    image: node:24-trixie@sha256:016f604a11c4c725f0a4c62e29ff11adab153d297bf97046c9bf2ddb9f1011d3 # node:24-trixie @ 2026-10-24
    commands:
      - sh target/certification/ci/scope-vscode.sh

  - name: jetbrains-scope
    depends_on: [scope]
    image: ghcr.io/sbelakho2/faktor-ci@sha256:bf7739456df1fc9aad818f4dc08990092f89d4c36785abedc14751441b143166 # faktor-ci (linux/amd64) built from docker/faktor-ci/Dockerfile; digest recorded in docker/faktor-ci/image-digest.txt
    commands:
      - sh target/certification/ci/scope-jetbrains.sh
