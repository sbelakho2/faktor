# Faktor CI — nightly campaign (Woodpecker cron event, job name `nightly`).
#
# REGISTRATION: a cron workflow only runs after the matching cron job exists
# on the project whose pipeline path contains this file — the TRUSTED
# project. Register it with
#   bash scripts/woodpecker/activate.sh <owner/repo> --run-now
# or via the API `POST /api/repos/{trusted_repo_id}/cron` with
#   {"name":"nightly","schedule":"0 3 * * *","branch":"main","timezone":"UTC","enabled":true}
# (or Project Settings → Cron Jobs in the UI). The untrusted PR project must
# never carry a cron job. See setup.md §5/§6.
#
# STORAGE POLICY: cron events are trusted (server-owned, default-branch
# config) and this file belongs to the trusted project (trusted.volumes=true),
# so it uses its own `faktor-nightly-*` named volumes. It never mounts the
# `faktor-trusted-*` caches, and `.woodpecker/untrusted/pr.yaml` never mounts
# these. Every lane has its own target volume so the parallel cargo invocations
# do not fight over a target-dir lock.
#
# Coverage: [fault] campaigns at scale, the longrun suite (release), the
# efficiency harness, the economy suite, the coding-benchmark smoke, the
# provider-key real-model run (recorded as an explicit skip unless keys are
# supplied out-of-band — CI requires NO secrets by default), and the
# supply-chain evidence job (missing advisory tools stay loud recorded skips
# inside target/certification/supply-chain-status.json).
#
# Timeout: Woodpecker has no per-step timeout; the project pipeline timeout
# applies. The 24h REAL-TIME soak lane needs a >= 25h budget, so raise it
# (setup.md §6):
#   server:  WOODPECKER_MAX_PIPELINE_TIMEOUT=1560
#   project: PATCH /api/repos/{trusted_repo_id} {"timeout":1560}
# Toolchain authority: `rust-toolchain.toml` pins channel 1.98.0 with
# components rustfmt+clippy (profile minimal). Every `rust:1.98.0` image
# below is only a rustup baseline; the cargo/rustc shims resolve the exact
# channel from the toolchain file. EVERY image is pinned by multi-arch index
# digest (comment records the original tag and the date); an image line
# without `@sha256:` fails `scripts/check-ci-image-pins.sh`.
#
# Ignored-test lanes: the `fault-scale`, `soak` and `longrun` (release)
# steps execute the ignored-test groups assigned to the fault/soak/release
# nightly lanes. `node scripts/check-ignored-tests.mjs` (run first in the
# certificate job) enforces the `[fault]/[soak]/[security]/[release]/[perf]/
# [live-paid]` tag convention and requires every `#[ignore]`d test to be
# assigned to a lane wired here or documented as manual/live-paid in
# `scripts/certification/ignored-tests.json`.
#
# Commit-status context (default format): ci/woodpecker/cron/nightly
#
# Lane-bound marker auth (attribution, per-lane marker HMAC): every nightly
# lane emits its marker through scripts/certification/lane-marker.sh, which
# adds `"auth":"hmac-sha256:<hex>"` over the canonical unsigned marker JSON
# using the lane's OWN CI secret. To enable verification, register one secret
# per lane on the TRUSTED project and map it BOTH in the lane step's
# `environment:` and in `certificate-nightly`'s `environment:` (see
# scripts/woodpecker/setup.md §4):
#
#   fault-scale                          faktor_lane_token_fault_scale
#   soak                                 faktor_lane_token_soak
#   longrun                              faktor_lane_token_longrun
#   efficiency                           faktor_lane_token_efficiency
#   contention                           faktor_lane_token_contention
#   economy                              faktor_lane_token_economy
#   coding-benchmark                     faktor_lane_token_coding_benchmark
#   coding-benchmark-real-model          faktor_lane_token_coding_benchmark_real_model
#   supply-chain                         faktor_lane_token_supply_chain
#
# env var name = `faktor_lane_token_<lane>` with '-' -> '_' (the uppercase
# FAKTOR_LANE_TOKEN_<LANE> form is also accepted). A lane step only receives
# its own token, so it cannot mint another lane's MAC; the certificate step
# receives all of them and rejects wrong or missing auth. While a mapping is
# absent the marker carries no auth and verify-markers records that lane as
# `unattested` — visible, never silently passed — with no hard failure.

labels:
  platform: linux/amd64

when:
  - event: cron
    cron: nightly

steps:
  - name: fault-scale
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
    volumes:
      - faktor-nightly-cargo-registry:/usr/local/cargo/registry
      - faktor-nightly-cargo-git:/usr/local/cargo/git
      - faktor-nightly-target-fault:/woodpecker-cache/target
    commands:
      - cargo test -p faktor-tests-fault -p faktor-updater --release -- --ignored
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cargo test -p faktor-tests-fault -p faktor-updater --release -- --ignored
        CMDS
        )"
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane fault-scale --status passed \
          --out target/certification/lanes/fault-scale.json
  - name: soak
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
      # REAL-TIME durability run: scripts/soak.sh --mode realtime keeps the
      # convergence churn workload running until FAKTOR_SOAK_REALTIME_SECONDS
      # of real wall clock has elapsed (never shortened by a fast workload),
      # plus the keyless accounting modelcheck lane test. The mandatory
      # quiescent-convergence checker then evaluates every typed metric and
      # ANY failed metric fails the lane. The per-release trusted push gate
      # runs the same driver as the 30-60 min churn. The project must raise
      # the pipeline timeout to >= 25h (WOODPECKER_MAX_PIPELINE_TIMEOUT).
      FAKTOR_SOAK_MODE: realtime
      FAKTOR_SOAK_REALTIME_SECONDS: "86400"
      FAKTOR_SOAK_CONVERGENCE: required
      FAKTOR_SOAK_LANE: soak
      # Sparse sampling over 24h: 5760 bounded samples is far more than the
      # checker's percentile windows need and keeps the sampler light.
      FAKTOR_SOAK_SAMPLE_INTERVAL: "15"
      FAKTOR_SOAK_MAX_WALL_SECONDS: "90000"
      FAKTOR_SOAK_TEST_TIMEOUT_SECONDS: "88200"
    volumes:
      - faktor-nightly-cargo-registry:/usr/local/cargo/registry
      - faktor-nightly-cargo-git:/usr/local/cargo/git
      - faktor-nightly-target-soak:/woodpecker-cache/target
    commands:
      # Exact-SHA real-time soak: the keyless ignored [soak] tests assigned to
      # this lane in scripts/certification/ignored-tests.json. The convergence
      # test honors the real target; soak_12h_scale stays a manual operator
      # test (its 10k-turn synthetic scale is superseded here by real wall
      # time). The registry command must match this step verbatim.
      - bash scripts/soak.sh --mode realtime -p faktor-tests-soak -p faktor-tests-accounting-modelcheck --release -- --ignored --skip soak_12h_scale
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        bash scripts/soak.sh --mode realtime -p faktor-tests-soak -p faktor-tests-accounting-modelcheck --release -- --ignored --skip soak_12h_scale
        CMDS
        )"
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane soak --status passed \
          --artifact target/certification/soak.json \
          --out target/certification/lanes/soak.json
  - name: longrun
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
    volumes:
      - faktor-nightly-cargo-registry:/usr/local/cargo/registry
      - faktor-nightly-cargo-git:/usr/local/cargo/git
      - faktor-nightly-target-longrun:/woodpecker-cache/target
    commands:
      - cargo test -p faktor-tests-longrun --release
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cargo test -p faktor-tests-longrun --release
        CMDS
        )"
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane longrun --status passed \
          --out target/certification/lanes/longrun.json
  - name: efficiency
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
    volumes:
      - faktor-nightly-cargo-registry:/usr/local/cargo/registry
      - faktor-nightly-cargo-git:/usr/local/cargo/git
      - faktor-nightly-target-efficiency:/woodpecker-cache/target
    commands:
      - cargo test -p faktor-tests-efficiency
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cargo test -p faktor-tests-efficiency
        CMDS
        )"
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane efficiency --status passed \
          --out target/certification/lanes/efficiency.json
  # Audit 27: the reproducible multi-agent contention benchmark. 32 concurrent
  # sessions with child agents, direct + SSE journal readers, index rebuilds,
  # tool records and budget writes; records p50/p95/p99 turn bookkeeping,
  # DB writer wait, reader-pool wait, WAL and RSS, and asserts GENEROUS
  # regression bounds (tail-latency teeth only). Normal PR runs never touch it:
  # the test is #[ignore]d and only the nightly/trusted lanes select it.
  - name: contention
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
    volumes:
      - faktor-nightly-cargo-registry:/usr/local/cargo/registry
      - faktor-nightly-cargo-git:/usr/local/cargo/git
      - faktor-nightly-target-contention:/woodpecker-cache/target
    commands:
      - cargo test -p faktor-tests-performance --release --test contention -- --ignored
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cargo test -p faktor-tests-performance --release --test contention -- --ignored
        CMDS
        )"
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane contention --status passed \
          --out target/certification/lanes/contention.json
  - name: economy
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
    volumes:
      - faktor-nightly-cargo-registry:/usr/local/cargo/registry
      - faktor-nightly-cargo-git:/usr/local/cargo/git
      - faktor-nightly-target-economy:/woodpecker-cache/target
    commands:
      - cargo test -p faktor-tests-economy
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cargo test -p faktor-tests-economy
        CMDS
        )"
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane economy --status passed \
          --out target/certification/lanes/economy.json
  - name: coding-benchmark
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
    volumes:
      - faktor-nightly-cargo-registry:/usr/local/cargo/registry
      - faktor-nightly-cargo-git:/usr/local/cargo/git
      - faktor-nightly-target-bench:/woodpecker-cache/target
    commands:
      - cargo test -p faktor-tests-coding-benchmark --test smoke
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cargo test -p faktor-tests-coding-benchmark --test smoke
        CMDS
        )"
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane coding-benchmark --status passed \
          --out target/certification/lanes/coding-benchmark.json
  - name: coding-benchmark-real-model
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
    volumes:
      - faktor-nightly-cargo-registry:/usr/local/cargo/registry
      - faktor-nightly-cargo-git:/usr/local/cargo/git
      - faktor-nightly-target-real:/woodpecker-cache/target
    commands:
      - |
        set -eu
        if [ -n "${FAKTOR_BENCH_API_KEY:-}" ] && [ -n "${FAKTOR_BENCH_PROVIDER:-}" ] && [ -n "${FAKTOR_BENCH_MODEL:-}" ]; then
          cargo test -p faktor-tests-coding-benchmark --test real -- --ignored
          status="passed"; reason=""
        else
          status="skipped"
          reason="provider-key run recorded as a skip: FAKTOR_BENCH_PROVIDER/FAKTOR_BENCH_MODEL/FAKTOR_BENCH_API_KEY are not configured; nightly never spends by default"
        fi
      - |
        set -u
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        set -eu
        if [ -n "${FAKTOR_BENCH_API_KEY:-}" ] && [ -n "${FAKTOR_BENCH_PROVIDER:-}" ] && [ -n "${FAKTOR_BENCH_MODEL:-}" ]; then
        cargo test -p faktor-tests-coding-benchmark --test real -- --ignored
        status="passed"; reason=""
        else
        status="skipped"
        reason="provider-key run recorded as a skip: FAKTOR_BENCH_PROVIDER/FAKTOR_BENCH_MODEL/FAKTOR_BENCH_API_KEY are not configured; nightly never spends by default"
        fi
        CMDS
        )"
        if [ -n "${FAKTOR_BENCH_API_KEY:-}" ] && [ -n "${FAKTOR_BENCH_PROVIDER:-}" ] && [ -n "${FAKTOR_BENCH_MODEL:-}" ]; then
          status="passed"; reason=""
        else
          status="skipped"
          reason="provider-key run recorded as a skip: FAKTOR_BENCH_PROVIDER/FAKTOR_BENCH_MODEL/FAKTOR_BENCH_API_KEY are not configured; nightly never spends by default"
        fi
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane coding-benchmark-real-model --status "$status" --reason "$reason" \
          --out target/certification/lanes/coding-benchmark-real-model.json
        echo "coding-benchmark-real-model: $status ${reason:+(recorded skip)}"
  - name: supply-chain
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
    volumes:
      - faktor-nightly-cargo-registry:/usr/local/cargo/registry
      - faktor-nightly-cargo-git:/usr/local/cargo/git
      - faktor-nightly-target-supply:/woodpecker-cache/target
    commands:
      - SUPPLY_CHAIN_BUILD=1 SUPPLY_CHAIN_ARTIFACTS="$CARGO_TARGET_DIR/release/faktor-cli" bash scripts/supply-chain.sh
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        SUPPLY_CHAIN_BUILD=1 SUPPLY_CHAIN_ARTIFACTS="$CARGO_TARGET_DIR/release/faktor-cli" bash scripts/supply-chain.sh
        CMDS
        )"
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane supply-chain --status passed \
          --out target/certification/lanes/supply-chain.json
  - name: certificate-nightly
    image: node:24@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4 # node:24 @ 2026-09-23
    depends_on:
      - fault-scale
      - soak
      - longrun
      - efficiency
      - contention
      - economy
      - coding-benchmark
      - coding-benchmark-real-model
      - supply-chain
    when:
      status: [success, failure]
    # Lane-bound auth verification (opt-in): map every registered lane token
    # here so verify-markers can check each marker's `auth` HMAC. Unmapped
    # lanes are still checked but recorded `unattested`. All lines are
    # comments today so the pipeline compiles without the secrets:
    # environment:
    #   faktor_lane_token_fault_scale: { from_secret: faktor_lane_token_fault_scale }
    #   faktor_lane_token_soak: { from_secret: faktor_lane_token_soak }
    #   faktor_lane_token_longrun: { from_secret: faktor_lane_token_longrun }
    #   faktor_lane_token_efficiency: { from_secret: faktor_lane_token_efficiency }
    #   faktor_lane_token_contention: { from_secret: faktor_lane_token_contention }
    #   faktor_lane_token_economy: { from_secret: faktor_lane_token_economy }
    #   faktor_lane_token_coding_benchmark: { from_secret: faktor_lane_token_coding_benchmark }
    #   faktor_lane_token_coding_benchmark_real_model: { from_secret: faktor_lane_token_coding_benchmark_real_model }
    #   faktor_lane_token_supply_chain: { from_secret: faktor_lane_token_supply_chain }
    commands:
      # Enforce the ignored-test inventory first: every #[ignore] site must be
      # conventionally tagged and assigned to a lane wired in this workflow
      # (or documented as manual/live-paid) — see scripts/check-ignored-tests.mjs.
      - node scripts/check-ignored-tests.mjs
      - node scripts/certification/evidence.mjs verify-markers --workflow nightly --yaml-dir .woodpecker/trusted --lanes-dir target/certification/lanes --out target/certification/ci-certification.json --pipeline-status "$CI_PIPELINE_STATUS" --run-id "$CI_PIPELINE_NUMBER"
      - node scripts/certification/evidence.mjs write --kind ci_certification_nightly --status passed --from-markers target/certification/lanes --commands "woodpecker nightly campaign certificate"
      - |
        if node -e 'process.exit(require("./target/certification/lanes/coding-benchmark-real-model.json").status === "passed" ? 0 : 1)'; then
          node scripts/certification/evidence.mjs write --kind real_provider --status passed --from-markers target/certification/lanes --only-lane coding-benchmark-real-model --commands "provider-key real-model run at this commit"
        else
          echo "real_provider evidence not written: coding-benchmark-real-model recorded a skip (no keys)"
        fi