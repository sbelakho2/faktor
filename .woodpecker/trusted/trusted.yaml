        foreach ($lane in @("windows-check", "windows-test")) {
          $f = "target/certification/lanes/$lane.json"
          if ((Test-Path $f) -and (Select-String -Quiet -Path $f -Pattern '"schema":"faktor-woodpecker-lane/v2"') -and (Select-String -Quiet -Path $f -Pattern '"status":"passed"') -and (Select-String -Quiet -Path $f -Pattern ('"commit":"' + $env:CI_COMMIT_SHA + '"')) -and (Select-String -Quiet -Path $f -Pattern ('"tree":"' + $tree + '"'))) {
            Write-Host "passed $lane"
          } else {
            Write-Host "FAILED $lane (missing, failed, stale, wrong commit/tree, or wrong schema)"
            $rc = 1
          }
        }
        if ($env:CI_PIPELINE_STATUS -ne "success") {
          Write-Host "FAILED workflow status=$env:CI_PIPELINE_STATUS"
          $rc = 1
        }
        $st = if ($rc -eq 0) { "pass" } else { "fail" }
        $manifest = '{"schema":"faktor-ci-certification/v2","platform":"windows","workflow":"trusted","commit":"' + $env:CI_COMMIT_SHA + '","tree":"' + $tree + '","pipeline":"' + $env:CI_PIPELINE_NUMBER + '","status":"' + $st + '"}'
        Set-Content -Path target/certification/ci-certification-windows.json -Value $manifest
        Write-Host "certification=$st platform=windows"
        if ($rc -ne 0) { exit 1 }