  - name: certificate
    image: node:24@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4 # node:24 @ 2026-09-23
    depends_on:
      - linux
      - static
      - docs
      - vscode
      - jetbrains-build
      - jetbrains-smoke
      - perf
    when:
      matrix:
        platform: linux/amd64
