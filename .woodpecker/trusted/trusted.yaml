  - name: certificate
    image: node:24@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4 # node:24 @ 2026-09-23
    depends_on:
      - linux
      - static
      - docs
      - soak-smoke
      - vscode
      - vscode-e2e
      - jetbrains-build
      - jetbrains-smoke
      - perf
      - release-artifacts
    when:
      matrix:
        platform: linux/amd64
      status: [success, failure]
    # Lane-bound auth verification (opt-in): map every registered lane token
    # here so verify-markers can check each marker's `auth` HMAC. Unmapped
    # lanes are still checked but recorded `unattested`. All lines are
    # comments today so the pipeline compiles without the secrets:
    # environment:
    #   faktor_lane_token_linux: { from_secret: faktor_lane_token_linux }
    #   faktor_lane_token_static: { from_secret: faktor_lane_token_static }
    #   faktor_lane_token_docs: { from_secret: faktor_lane_token_docs }
    #   faktor_lane_token_soak_smoke: { from_secret: faktor_lane_token_soak_smoke }
    #   faktor_lane_token_vscode: { from_secret: faktor_lane_token_vscode }
    #   faktor_lane_token_vscode_e2e: { from_secret: faktor_lane_token_vscode_e2e }
    #   faktor_lane_token_jetbrains_build: { from_secret: faktor_lane_token_jetbrains_build }
    #   faktor_lane_token_jetbrains_smoke: { from_secret: faktor_lane_token_jetbrains_smoke }
    #   faktor_lane_token_perf: { from_secret: faktor_lane_token_perf }
    #   faktor_lane_token_release_artifacts: { from_secret: faktor_lane_token_release_artifacts }
    commands:
      # Enforce the ignored-test inventory first: every #[ignore] site must be
      # conventionally tagged and lane-assigned in .woodpecker/trusted/nightly.yaml
      # or documented as manual/live-paid (scripts/certification/ignored-tests.json).
      - node scripts/check-ignored-tests.mjs
      # Invariant registry coverage (node-only; the rust static lane has no node).
      - node scripts/check-invariants.mjs
      # P1-ASSURANCE: every production crate enumerated from cargo metadata
      # must carry an explicit disposition (release-critical owner, covered
      # via registered invariants, or a documented gap). Unknown owners and
      # unclassified new crates fail.
      - node scripts/check-invariant-coverage.mjs selftest && node scripts/check-invariant-coverage.mjs --check
      # README/docs capability claims are enforced HERE because this is the
      # node-carrying lane (`check-docs-sync.sh` skips the check without node).
      - node scripts/capabilities-manifest.mjs --selftest && node scripts/capabilities-manifest.mjs --check-claims
      # The planted-mutation campaign runs in the jetbrains-smoke lane, which
      # carries cargo, JDK/gradle and Node; this node-only image has none of
      # those toolchains, so running it here would count exit-127 environment
      # failures as detections.
      # Frozen contracts: the compiled-vs-frozen drift check ran in the static
      # lane (cargo); this node-only half re-hashes every checked-in canonical
      # file against manifest.json and binds the contract digest into the
      # certificate evidence below.
      - node scripts/contracts/emit.mjs selftest
      # P1-PROOF: ONE top-level gate binding the offline-provable release
      # facts (registry, coverage, workflow graph, publishers, soak sampler,
      # visual record, contracts) to the ACTUAL checkout bytes — the hash of
      # every tracked worktree file, not merely HEAD^{tree} — and refusing a
      # dirty checkout. Runtime-only facts (platform authentication, mutation
      # tree barrier, quiescence, host UI matrices) stay explicit in the
      # report's `not_proven_here` list and are enforced by their own lanes.
      - node scripts/certification/prove-all.mjs
      - |
        set -eu
        contracts_digest="$(node scripts/contracts/emit.mjs verify --print-digest)"
        node scripts/certification/evidence.mjs verify-markers --workflow trusted --yaml-dir .woodpecker/trusted --lanes-dir target/certification/lanes --out target/certification/ci-certification.json --pipeline-status "$CI_PIPELINE_STATUS" --run-id "$CI_PIPELINE_NUMBER"
        node scripts/certification/evidence.mjs write --kind ci_certification_trusted --status passed \
          --from-markers target/certification/lanes \
          --field "contracts_digest=$contracts_digest" \
          --commands "woodpecker trusted linux workflow certificate contracts_digest=$contracts_digest"

  # P0-1: the linux platform's own exact-SHA status. The aggregate below
  # requires ALL THREE platform contexts; a missing or failing platform can
  # never aggregate green. The publisher signs the fact with the linux
  # platform key (P0-CERT), so only the linux lane can mint a linux
  # certificate.
  - name: certificate-status-linux
    image: node:24@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4 # node:24 @ 2026-09-23
    depends_on: [certificate]
    when:
      matrix:
        platform: linux/amd64
      status: [success, failure]
    environment:
      GITHUB_STATUS_TOKEN: { from_secret: faktor_github_status_token }
      faktor_platform_status_key_linux: { from_secret: faktor_platform_status_key_linux }
    commands:
      - node scripts/certification/publish-status.mjs selftest
      - |
        set -eu
        tree="$(git rev-parse 'HEAD^{tree}')"
        state=failure
        if [ -f target/certification/ci-certification.json ] && grep -qE '"status": *"pass"' target/certification/ci-certification.json; then
          state=success
        fi
        node scripts/certification/publish-status.mjs publish \
          --repo "$CI_REPO" --sha "$CI_COMMIT_SHA" --state "$state" \
          --platform linux --tree "$tree" --run-prefix "$CI_PIPELINE_NUMBER" \
          --context ci/faktor/trusted-certified-linux \
          --target-url "${CI_PIPELINE_URL:-https://woodpecker.invalid/pipelines/$CI_PIPELINE_NUMBER}"
        [ "$state" = success ]

  # Audit 23: exact-SHA GitHub commit status for the trusted pipeline. Runs
  # AFTER the certificate step on success AND failure, so a failed lane or a
  # failed certificate still publishes a conclusive non-success status for
  # CI_COMMIT_SHA under the registered trusted context. Failures BEFORE any
  # step can run (workflow config/startup errors) are published by
  # Woodpecker's own forge integration as the pipeline's error status for the
  # same context; scripts/certify.sh re-verifies conclusiveness for the exact
  # shipped SHA through the GitHub API (check_forge_metadata, audit 22/23).
  # FAIL-CLOSED: the step needs the `faktor_github_status_token` secret and
  # the three platform keys; a missing secret or a non-2xx API answer fails
  # the step (no silent skip).
  - name: status-publish
    image: node:24@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4 # node:24 @ 2026-09-23
    depends_on:
      - certificate
      - certificate-status-linux
    when:
      matrix:
        platform: linux/amd64
      # PUSH + MAIN ONLY: this aggregate is the branch-protection context.
      # Tag events and non-main pushes run only the linux axis (darwin and
      # windows are main-push lanes), so a three-platform aggregate can never
      # conclude there; the tagged/main commit already carries the push
      # pipeline's aggregate status for the same SHA and certify.sh binds
      # release certification to that exact-SHA fact. check-workflow-graph.mjs
      # proves every aggregate invocation has all three producers (P1-CI).
      event: push
      branch: main
      status: [success, failure]
    environment:
      GITHUB_STATUS_TOKEN: { from_secret: faktor_github_status_token }
      # P0-CERT: the aggregate verifies each platform fact's HMAC against the
      # platform's OWN secret. Holding this step's environment (all three
      # keys) does not let it fabricate a certificate: it would have to mint
      # one, and the signed payload binds platform/sha/tree/run/context.
      faktor_platform_status_key_linux: { from_secret: faktor_platform_status_key_linux }
      faktor_platform_status_key_darwin: { from_secret: faktor_platform_status_key_darwin }
      faktor_platform_status_key_windows: { from_secret: faktor_platform_status_key_windows }
    commands:
      - node scripts/certification/publish-status.mjs selftest
      # P1-CI: the workflow graph must keep every aggregate invocation
      # satisfiable (all three axes run wherever the aggregate runs).
      - node scripts/certification/check-workflow-graph.mjs selftest && node scripts/certification/check-workflow-graph.mjs --check
      # P0-1/P0-CERT SEMANTIC AGGREGATE: poll the three PER-PLATFORM exact-SHA
      # contexts for the same tree and publish success only when linux AND
      # darwin AND windows all passed AND each signature verifies with its
      # platform's own key. Missing, unsigned, failing, stale, or
      # run-masqueraded platform statuses publish a conclusive non-success.
      - |
        set -u
        tree="$(git rev-parse 'HEAD^{tree}')"
        node scripts/certification/publish-status.mjs aggregate \
          --repo "$CI_REPO" --sha "$CI_COMMIT_SHA" --tree "$tree" \
          --poll-seconds 3600 --interval-seconds 20 \
          --context "${CI_STATUS_CONTEXT:-ci/faktor/trusted-certified}"

  # Trusted-build attestation (P1-J): binds this certified run to the exact
  # source and to the bytes it produced. Runs only after the certificate step
  # succeeded. A `faktor-build-attestation/v1` object is written and its
  # base64 block is printed into this step's log; scripts/certify.sh fetches
  # the block from the Woodpecker API for the exact trusted pipeline and
  # refuses release certification on any mismatch.
  #
  # OBSERVED PIPELINE ID: verification binds `pipeline_id` unconditionally
  # whenever the certifier observed the API's own id for this run, so the
  # producer resolves that observed id here (GET
  # /api/repos/lookup/<repo>?project=trusted, then
  # /api/repos/<id>/pipelines/<CI_PIPELINE_NUMBER>, take `id`) using
  # WOODPECKER_HOST/WOODPECKER_TOKEN from the trusted-lane environment. The
  # lookup FAILS CLOSED with the typed `observed-pipeline-id-lookup-failed`
  # error — the pipeline number is never copied into the id field.
  #
  # FAIL-CLOSED SIGNING (operator): the ed25519 private key is registered on
  # the TRUSTED project as the secret `faktor_attest_signing_key` and mapped
  # into this step below. Without the secret the step FAILS with the typed
  # `signing-key-missing` error and writes NO attestation artifact — an
  # unsigned attestation cannot be produced. Generate the keypair with
  # `node scripts/certification/attestation.mjs keygen --out-key release.pem
  # --out-keys release-keys.json --key-id faktor-ci`, store the private key
  # only in the Woodpecker secret, and keep the public key in the repo
  # allowlist `scripts/certification/attestation-keys.json` (identities
  # `faktor-ci` and `faktor`); certify.sh verifies against that allowlist
  # (FAKTOR_ATTEST_KEYS). The documented alternative path is Sigstore/keyless
  # signing of the same payload with the pipeline's OIDC identity
  # (docs/certification.md §2.12); this step then stays unconfigured and
  # certify.sh keeps requiring the allowlisted ed25519 path.
  - name: attestation
    image: node:24@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4 # node:24 @ 2026-09-23
    depends_on:
      - certificate
    when:
      matrix:
        platform: linux/amd64
      status: [success]
    environment:
      FAKTOR_ATTEST_SIGN_KEY_PEM: { from_secret: faktor_attest_signing_key }
      FAKTOR_ATTEST_SIGN_KEY_ID: faktor-ci
      WOODPECKER_HOST: { from_secret: faktor_woodpecker_host }
      WOODPECKER_TOKEN: { from_secret: faktor_woodpecker_token }
    commands:
      - |
        set -eu
        event=push
        if [ -n "${CI_COMMIT_TAG:-}" ]; then event=tag; fi
        observed_pipeline_id="$(node - "$WOODPECKER_HOST" "$WOODPECKER_TOKEN" "$CI_REPO" "$CI_PIPELINE_NUMBER" <<'OBSERVED_ID'
        const [host, token, repo, number] = process.argv.slice(2);
        const fail = (message) => {
          console.error("observed-pipeline-id-lookup-failed: " + message);
          process.exit(1);
        };
        if (!host || !token || !repo || !number) {
          fail("WOODPECKER_HOST, WOODPECKER_TOKEN, CI_REPO and CI_PIPELINE_NUMBER are required");
        }
        const base = host.replace(/[/]+$/, "");
        const get = async (path) => {
          const res = await fetch(base + "/api" + path, { headers: { Authorization: "Bearer " + token } });
          if (!res.ok) throw new Error("GET " + path + " -> HTTP " + res.status);
          return res.json();
        };
        (async () => {
          const lookup = await get("/repos/lookup/" + repo + "?project=trusted");
          const repoId = lookup.id;
          if (repoId === undefined || repoId === null || repoId === "") {
            throw new Error("repository lookup for " + repo + " returned no id");
          }
          const detail = await get("/repos/" + encodeURIComponent(repoId) + "/pipelines/" + encodeURIComponent(number));
          const observedId = detail.id;
          if (observedId === undefined || observedId === null || String(observedId) === "") {
            throw new Error("pipeline " + number + " detail returned no id");
          }
          process.stdout.write(String(observedId));
        })().catch((error) => fail(error.message));
        OBSERVED_ID
        )"
        [ -n "$observed_pipeline_id" ] || { echo "observed-pipeline-id-lookup-failed: empty pipeline id" >&2; exit 1; }
        node scripts/certification/attestation.mjs create \
          --out target/certification/attestation/trusted-build-attestation.json \
          --workflow trusted --event "$event" --repo "$CI_REPO" \
          --source-sha "$CI_COMMIT_SHA" --tree-sha "$(git rev-parse 'HEAD^{tree}')" \
          --pipeline-number "${CI_PIPELINE_NUMBER:?}" \
          --pipeline-id "$observed_pipeline_id" \
          --workflow-file .woodpecker/trusted/trusted.yaml --step-name attestation \
          --rust-toolchain-file rust-toolchain.toml \
          --ci-image-ref "ghcr.io/sbelakho2/faktor-ci@$(grep -oE 'sha256:[0-9a-f]{64}' docker/faktor-ci/image-digest.txt | head -n 1)" \
          --from-lanes target/certification/lanes \
          --key-id "$FAKTOR_ATTEST_SIGN_KEY_ID" \
          --emit-log-block
  - name: certificate-darwin
    image: bash # digest-exempt: local-backend darwin agent executes the macOS host shell directly; no container image is pulled
    depends_on: [darwin-check, darwin-test, darwin-doctor]
    when:
      matrix:
        platform: darwin/arm64
      status: [success, failure]
    commands:
      - |
        set -u
        mkdir -p target/certification
        tree="$(git rev-parse 'HEAD^{tree}')"
        rc=0
        # Darwin-owned visual-record gate (P1-CERT/UI): the macos JetBrains
        # visual record must carry a resolved font fingerprint and a digest
        # distinct from every other platform; a record copied from linux is
        # not darwin proof. Re-pin on the Mac host with
        # `bash apps/jetbrains/compile-and-smoke.sh --write-baselines` and
        # commit visual-baselines.json. Until then this refuses the darwin
        # certificate by design (fail-closed operator step).
        python3 scripts/certification/check-visual-baseline.py selftest
        if python3 scripts/certification/check-visual-baseline.py \
             --platform macos \
             --file apps/jetbrains/frontend/src/test/resources/parity/visual-baselines.json; then
          echo "passed darwin-visual-baseline"
        else
          echo "FAILED darwin-visual-baseline (missing/unfingerprinted/copied macos record)"
          rc=1
        fi
        for lane in darwin-check darwin-test darwin-doctor; do
          f="target/certification/lanes/$lane.json"
          if [ -f "$f" ] && grep -q '"schema":"faktor-woodpecker-lane/v2"' "$f" && grep -q '"status":"passed"' "$f" && grep -q "\"commit\":\"$CI_COMMIT_SHA\"" "$f" && grep -q "\"tree\":\"$tree\"" "$f"; then
            echo "passed $lane"
          else
            echo "FAILED $lane (missing, failed, stale, wrong commit/tree, or wrong schema)"
            rc=1
          fi
        done
        if [ "$CI_PIPELINE_STATUS" != "success" ]; then
          echo "FAILED workflow status=$CI_PIPELINE_STATUS"
          rc=1
        fi
        if [ "$rc" -eq 0 ]; then st=pass; else st=fail; fi
        printf '{"schema":"faktor-ci-certification/v2","platform":"darwin","workflow":"trusted","commit":"%s","tree":"%s","pipeline":"%s","status":"%s"}\n' \
          "$CI_COMMIT_SHA" "$tree" "$CI_PIPELINE_NUMBER" "$st" > target/certification/ci-certification-darwin.json
        echo "certification=$st platform=darwin"
        [ "$rc" -eq 0 ]
  # P0-1: the darwin platform's own exact-SHA status (node-free host:
  # python3 stdlib publisher, fail-closed).
  - name: certificate-status-darwin
    image: bash # digest-exempt: local-backend darwin agent executes the macOS host shell directly; no container image is pulled
    depends_on: [certificate-darwin]
    when:
      matrix:
        platform: darwin/arm64
      status: [success, failure]
    environment:
      GITHUB_STATUS_TOKEN: { from_secret: faktor_github_status_token }
      faktor_platform_status_key_darwin: { from_secret: faktor_platform_status_key_darwin }
    commands:
      - |
        set -u
        tree="$(git rev-parse 'HEAD^{tree}')"
        state=failure
        if [ -f target/certification/ci-certification-darwin.json ] && grep -qE '"status": *"pass"' target/certification/ci-certification-darwin.json; then
          state=success
        fi
        python3 scripts/certification/publish-status.py publish \
          --repo "$CI_REPO" --sha "$CI_COMMIT_SHA" --state "$state" \
          --platform darwin --tree "$tree" --run-prefix "$CI_PIPELINE_NUMBER" \
          --context ci/faktor/trusted-certified-darwin
        [ "$state" = success ]

  - name: certificate-windows
    image: powershell # digest-exempt: self-hosted Windows agents execute the shell natively; no docker.io library image exists to record a digest from
    depends_on: [windows-check, windows-test, windows-visual-baseline]
    when:
      matrix:
        platform: windows/amd64
      status: [success, failure]
    commands:
      - |
        $ErrorActionPreference = "Stop"
        New-Item -ItemType Directory -Force -Path target/certification | Out-Null
        $tree = (git rev-parse 'HEAD^{tree}').Trim()
        $rc = 0
        foreach ($lane in @("windows-check", "windows-test", "windows-visual-baseline")) {
          $f = "target/certification/lanes/$lane.json"
          if ((Test-Path $f) -and (Select-String -Quiet -Path $f -Pattern '"schema":"faktor-woodpecker-lane/v2"') -and (Select-String -Quiet -Path $f -Pattern '"status":"passed"') -and (Select-String -Quiet -Path $f -Pattern ('"commit":"' + $env:CI_COMMIT_SHA + '"')) -and (Select-String -Quiet -Path $f -Pattern ('"tree":"' + $tree + '"'))) {
            Write-Host "passed $lane"
          } else {
            Write-Host "FAILED $lane (missing, failed, stale, wrong commit/tree, or wrong schema)"
            $rc = 1
          }
        }
        # Windows visual evidence is REQUIRED (canonical spec: the `windows`
        # workflow in scripts/certification/evidence.mjs): the visual lane must
        # have recorded target/certification/ci-certification-windows-visual.json,
        # the lane marker's artifact entry must hash to the file, and the record
        # must be a passed faktor-windows-visual-baseline/v1 for this commit/tree
        # with its own distinct windows environment fingerprint. A certificate
        # without it can never pass.
        $visualRecord = "target/certification/ci-certification-windows-visual.json"
        $visualLane = "target/certification/lanes/windows-visual-baseline.json"
        if (-not (Test-Path $visualRecord)) {
          Write-Host "FAILED windows-visual-baseline: missing required artifact $visualRecord"
          $rc = 1
        } else {
          foreach ($pattern in @('"schema"\s*:\s*"faktor-windows-visual-baseline/v1"', '"status"\s*:\s*"passed"', ('"commit"\s*:\s*"' + [regex]::Escape($env:CI_COMMIT_SHA) + '"'), ('"tree"\s*:\s*"' + [regex]::Escape($tree) + '"'), '"windows_environment"\s*:\s*"windows-', '"windows=certified"')) {
            if (-not (Select-String -Quiet -Path $visualRecord -Pattern $pattern)) {
              Write-Host "FAILED windows-visual-baseline: record misses $pattern"
              $rc = 1
            }
          }
          if (Test-Path $visualLane) {
            try {
              $marker = Get-Content -Raw $visualLane | ConvertFrom-Json
              $entry = @($marker.artifacts) | Where-Object { $_.path -eq $visualRecord } | Select-Object -First 1
              if ($null -eq $entry) {
                Write-Host "FAILED windows-visual-baseline: lane marker does not declare $visualRecord"
                $rc = 1
              } else {
                $hash = (Get-FileHash -Algorithm SHA256 -Path $visualRecord).Hash.ToLower()
                if ($entry.sha256 -ne "sha256:$hash") {
                  Write-Host "FAILED windows-visual-baseline: record sha256 drift ($($entry.sha256) != sha256:$hash)"
                  $rc = 1
                }
              }
            } catch {
              Write-Host "FAILED windows-visual-baseline: unreadable lane marker: $($_.Exception.Message)"
              $rc = 1
            }
          }
        }
        if ($env:CI_PIPELINE_STATUS -ne "success") {
          Write-Host "FAILED workflow status=$env:CI_PIPELINE_STATUS"
          $rc = 1
        }
        $st = if ($rc -eq 0) { "pass" } else { "fail" }
        $manifest = '{"schema":"faktor-ci-certification/v2","platform":"windows","workflow":"trusted","commit":"' + $env:CI_COMMIT_SHA + '","tree":"' + $tree + '","pipeline":"' + $env:CI_PIPELINE_NUMBER + '","status":"' + $st + '"}'
        Set-Content -Path target/certification/ci-certification-windows.json -Value $manifest
        Write-Host "certification=$st platform=windows"
        if ($rc -ne 0) { exit 1 }
  # P0-1: the windows platform's own exact-SHA status (PowerShell native).
  - name: certificate-status-windows
    image: powershell # digest-exempt: self-hosted Windows agents execute the shell natively; no docker.io library image exists to record a digest from
    depends_on: [certificate-windows]
    when:
      matrix:
        platform: windows/amd64
      status: [success, failure]
    environment:
      GITHUB_STATUS_TOKEN: { from_secret: faktor_github_status_token }
      faktor_platform_status_key_windows: { from_secret: faktor_platform_status_key_windows }
    commands:
      - |
        $ErrorActionPreference = "Stop"
        # P0-CERT canonical-payload parity: this pinned vector must equal the
        # node/python implementations' digest before any certificate is
        # signed, so the three publishers can never drift.
        $parityKey = "parity-check"
        $parityPayload = @(
          "faktor-platform-cert/v1",
          ("platform=windows"),
          ("sha=" + ("a" * 40)),
          ("tree=" + ("c" * 40)),
          "run=9:windows",
          "state=success",
          "context=ci/faktor/trusted-certified-windows"
        ) -join "`n"
        $parityHmac = New-Object System.Security.Cryptography.HMACSHA256
        $parityHmac.Key = [Text.Encoding]::UTF8.GetBytes($parityKey)
        $paritySig = ([BitConverter]::ToString($parityHmac.ComputeHash([Text.Encoding]::UTF8.GetBytes($parityPayload)))).Replace('-','').ToLower()
        if ($paritySig -ne "11b4ce142baf6b23938f45d647fe1d7420c633dcf1b1dbd8630b0eacc618c0fa") {
          Write-Error "windows platform-signature parity vector mismatch: $paritySig"
          exit 1
        }
        $tree = (git rev-parse 'HEAD^{tree}').Trim()
        $state = "failure"
        $file = "target/certification/ci-certification-windows.json"
        if ((Test-Path $file) -and (Select-String -Quiet -Path $file -Pattern '"status": *"pass"')) { $state = "success" }
        $platform = "windows"
        $run = "$($env:CI_PIPELINE_NUMBER):windows"
        $context = "ci/faktor/trusted-certified-windows"
        if ($state -eq "success") {
          $key = $env:faktor_platform_status_key_windows
          if (-not $key) { $key = $env:FAKTOR_PLATFORM_STATUS_KEY_WINDOWS }
          if (-not $key) {
            Write-Error "no faktor_platform_status_key_windows secret is configured; an unsigned platform certificate can never be published"
            exit 1
          }
          $payload = @(
            "faktor-platform-cert/v1",
            "platform=$platform",
            "sha=$($env:CI_COMMIT_SHA)",
            "tree=$tree",
            "run=$run",
            "state=success",
            "context=$context"
          ) -join "`n"
          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [Text.Encoding]::UTF8.GetBytes($key)
          $sig = ([BitConverter]::ToString($hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes($payload)))).Replace('-','').ToLower()
          $description = "tree=$tree run=$run sig=$sig"
        } else {
          $description = "tree=$tree run=$run state=$state"
        }
        $body = @{ state = $state; context = $context; description = $description } | ConvertTo-Json -Compress
        $headers = @{ Authorization = "Bearer $env:GITHUB_STATUS_TOKEN"; Accept = "application/vnd.github+json"; "User-Agent" = "faktor-certification" }
        $url = "https://api.github.com/repos/$($env:CI_REPO)/statuses/$($env:CI_COMMIT_SHA)"
        Invoke-RestMethod -Method Post -Uri $url -Headers $headers -ContentType "application/json" -Body $body | Out-Null
        Write-Host "github-status-published context=$context state=$state"
        if ($state -ne "success") { exit 1 }