# Faktor CI — trusted workflow: push (any branch) + version tags.
#
# TRUST BOUNDARY: this file lives at the pipeline path of the TRUSTED
# Woodpecker project (server-side: trusted.volumes=true, allow_pr=false).
# The pipeline path is a project setting; a PR diff cannot move the trusted
# project onto its own YAML, and the untrusted PR project (trusted=false)
# cannot mount volumes at policy level. See scripts/woodpecker/setup.md §5.
#
# This is the only workflow file set that declares named volumes. The
# untrusted pull_request event runs `.woodpecker/untrusted/pr.yaml`, which
# declares none, so a PR pipeline can never mount (or write into) the
# `faktor-trusted-*` caches. The cron workflow
# (`.woodpecker/trusted/nightly.yaml`) uses its own `faktor-nightly-*`
# volumes so heavy campaigns cannot poison these caches either.
#
# Job graph (one workflow per matrix platform; all mandatory linux lanes run
# as parallel steps of a single workflow so they share one workspace):
#
#   stage 1 (parallel): linux · static · docs · soak-smoke · vscode
#                       · jetbrains-build · jetbrains-smoke
#   stage 2:            perf (after linux, static, docs)
#   stage 3:            vscode-e2e (after vscode)
#   stage 4:            certificate (after every linux lane)
#
#   darwin combo:  darwin-check · darwin-test · darwin-doctor -> certificate-darwin
#   windows combo: windows-check · windows-test · windows-visual-baseline
#                  -> certificate-windows
#
# Aggregation mechanism (the one Woodpecker actually supports):
#   * Woodpecker workflows are filesystem-isolated, so markers only work
#     between steps of ONE workflow (docs: "files are only shared between
#     steps of the same workflow"). Every lane therefore ends by writing
#     target/certification/lanes/<lane>.json with its lane name, commit and
#     status; the certificate step depends_on every lane, runs with
#     `when.status: [success, failure]` (dependents are otherwise skipped
#     when a dependency fails) and fails when any marker is missing, marked
#     failed, carries a foreign commit, or is not the expected schema.
#   * CI_PIPELINE_STATUS is the runtime's own "workflow failed before this
#     step" signal and is checked as an independent second condition.
#   * The per-platform certificate steps cover the self-hosted darwin and
#     windows agents; cross-platform lanes cannot be folded into the linux
#     certificate because workflows share no filesystem.
#
# Lane-bound marker auth (attribution, per-lane marker HMAC): every linux lane
# emits its marker through scripts/certification/lane-marker.sh, which adds
# `"auth":"hmac-sha256:<hex>"` over the canonical unsigned marker JSON using
# the lane's OWN CI secret. To enable verification, register one secret per
# lane on the TRUSTED project and map it BOTH in the lane step's
# `environment:` and in the `certificate` step's `environment:` (see
# scripts/woodpecker/setup.md §4 for registration):
#
#   linux                  faktor_lane_token_linux
#   static                 faktor_lane_token_static
#   docs                   faktor_lane_token_docs
#   soak-smoke             faktor_lane_token_soak_smoke
#   vscode                 faktor_lane_token_vscode
#   vscode-e2e             faktor_lane_token_vscode_e2e
#   jetbrains-build        faktor_lane_token_jetbrains_build
#   jetbrains-smoke        faktor_lane_token_jetbrains_smoke
#   perf                   faktor_lane_token_perf
#   release-artifacts      faktor_lane_token_release_artifacts
#
# env var name = `faktor_lane_token_<lane>` with '-' -> '_' (the uppercase
# FAKTOR_LANE_TOKEN_<LANE> form is also accepted), e.g. in a lane step:
#   environment:
#     faktor_lane_token_linux: { from_secret: faktor_lane_token_linux }
# A lane step only receives its own token, so it cannot mint another lane's
# MAC; the certificate step receives all of them and rejects wrong or missing
# auth. While a mapping is absent (untrusted/PR project, unconfigured
# operator) the marker carries no auth and verify-markers records that lane as
# `unattested` — visible, never silently passed — with no hard failure:
# binding is opt-in per configured secret.
#
# Clean-checkout binding (P0-CERT): every marker records `clean` (true only
# when `git diff --exit-code` and `git diff --cached --exit-code` both pass
# at marker time). `verify-markers` rejects a lane whose marker records a
# dirty tracked tree: the recorded HEAD^{tree} is not what ran, so the
# evidence cannot certify. The mutation campaign never touches this tree at
# all (scripts/mutation-run.mjs runs every planted edit and gate in an
# isolated copy and check-invariants hashes this checkout continuously while
# the campaign runs).
#
# Platform certificate authentication (P0-CERT, MANDATORY — not opt-in): each
# per-platform certificate status is HMAC-SHA256-signed over the canonical
# `faktor-platform-cert/v1` payload (platform/sha/tree/run/state/context)
# with that platform's OWN secret:
#
#   linux    faktor_platform_status_key_linux
#   darwin   faktor_platform_status_key_darwin
#   windows  faktor_platform_status_key_windows
#
# Register all three on the TRUSTED project. The aggregate step receives all
# three and publishes green ONLY when every platform status signature
# verifies with its own key; a missing secret, a missing signature or a
# signature minted with the wrong platform key is a conclusive non-success.
# The linux publisher (node), the darwin publisher (python3) and the windows
# publisher (PowerShell) pin the same canonical-payload test vector so the
# three implementations cannot drift.
#
# Agent routing: `labels.platform` is the documented agent selector. The
# deprecated `runs_on` key is NOT an agent selector in 3.x (it feeds the
# run-on-success/failure flag of dependent tasks and would make a workflow
# never match); see scripts/woodpecker/setup.md.
#
# Named volumes (cargo/gradle/npm/playwright caches) require the trusted
# PROJECT (not just the repository) to be marked Trusted (volumes) by a
# server admin; delete the `volumes:` lines if your instance cannot grant
# that. The build/test lanes need no secrets; the final `attestation` step is
# fail-closed and needs the `faktor_attest_signing_key` secret (see its
# comment below) or it fails without writing an attestation.
#
# Bootstrap audit: the JetBrains smoke toolchain is installed from the pinned
# rustup-init binary after verifying its published SHA-256; no step pipes a
# remote script into a shell.
#
# Toolchain authority: `rust-toolchain.toml` pins channel 1.98.0 with
# components rustfmt+clippy (profile minimal). The `rust:1.98.0` image is
# only a rustup baseline: the cargo/rustc shims resolve the exact channel
# from the toolchain file, and the linux lane asserts that resolution before
# running the gates. The JetBrains smoke lane derives its rustup-init
# `--default-toolchain` from the same file — never a second hard-coded Rust
# version.
#
# Image pinning: EVERY container image in every workflow is pinned by its
# multi-arch index digest (the trailing comment records the original tag and
# the date the digest was recorded), including the Rust baseline image.
# `scripts/check-ci-image-pins.sh` enforces this in the `image-pins` step: an
# image line without `@sha256:` fails the pipeline unless it is explicitly
# annotated `digest-exempt: <reason>` (the self-hosted Windows `powershell`
# and the local-backend darwin `bash` shell pseudo-images are the documented
# exemptions). The toolchain file, not the image, remains
# the Rust channel authority.
#
# Hermetic toolchain (P1): trusted lanes run NO apt at all. The rust/node
# stock baselines already ship the tools their old apt steps installed
# (python3, ps, unzip and ca-certificates are present in the pinned images),
# and the JetBrains build and smoke lanes run on the dedicated Faktor CI
# image from `docker/faktor-ci/Dockerfile` (git + JDK 17 included),
# referenced by the digest recorded in
# `docker/faktor-ci/image-digest.txt` (built by `scripts/build-ci-image.sh`).
# The required `ci-image` pre-step runs ON that exact digest with
# `pull: false`; if the image was not produced on the agent the container
# cannot start and the pipeline fails closed — there is no live-apt fallback.
# The same digest is recorded as `build_environment_digest` in the
# attestation step.
#
# Commit-status contexts (default `WOODPECKER_STATUS_CONTEXT_FORMAT`):
#   push: ci/faktor/trusted-certified   tag: ci/faktor/tag-certified
#
# Matrix status semantics (Woodpecker 3.x): a matrix workflow publishes one
# status PER AXIS (contexts like `ci/woodpecker/push/trusted/<axis_id>`).
# Those per-axis contexts are informational; branch protection and release
# certification require ONLY the dedicated non-matrix aggregate below, which
# the certificate/status steps publish after every required lane passed:
# `ci/faktor/trusted-certified-linux`, `...-darwin`, `...-windows` are the
# per-platform facts; `ci/faktor/trusted-certified` is published ONLY on
# pushes to main by `status-publish` after ALL THREE exact-SHA, same-tree,
# same-pipeline-run platform certificates are green AND each signature
# verifies with its platform's own key (a missing, UNATTESTED, stale or
# failing platform publishes a conclusive non-success instead).
# `scripts/certification/check-workflow-graph.mjs` proves for every
# event × branch × platform combination that every aggregate invocation has
# a producer for every mandatory input.

matrix:
  platform:
    - linux/amd64
    - darwin/arm64
    - windows/amd64

labels:
  platform: ${platform}

# push (any branch) and tag events are collaborator-authored: only these may
# mount the trusted caches. pull_request never reaches this file.
when:
  - event: [push, tag]
    evaluate: 'platform == "linux/amd64"'
  - event: push
    branch: main
    evaluate: 'platform != "linux/amd64"'

steps:
  # ---------------------------------------------------------- image pins --
  # Every image in every workflow must be digest-pinned (the self-hosted
  # Windows powershell and the local-backend darwin bash shell lines are the
  # documented digest-exempt cases).
  - name: image-pins
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc # alpine:3.20 @ 2026-09-23
    when:
      matrix:
        platform: linux/amd64
    commands:
      - sh scripts/check-ci-image-pins.sh

  # ------------------------------------------------------------- ci-image --
  # Required pre-step (P1 hermetic CI): every lane that used to run apt on
  # the stock ubuntu image now runs on the digest-pinned Faktor CI image.
  # This step runs ON that exact digest with pull disabled, so the pipeline
  # fails closed when the image cannot be produced/pulled — no lane falls
  # back to live apt. It re-verifies every exact package pin from the
  # Dockerfile against the running image and that apt points at the fixed
  # snapshot only (scripts/build-ci-image.sh --verify-runtime).
  - name: ci-image
    image: ghcr.io/sbelakho2/faktor-ci@sha256:04d473828cc7634f0168a62c9340f1cf3d585f97adc655755f780af82bd6ee13 # faktor-ci (linux/amd64) built from docker/faktor-ci/Dockerfile; digest recorded in docker/faktor-ci/image-digest.txt
    pull: false
    when:
      matrix:
        platform: linux/amd64
    commands:
      - sh scripts/build-ci-image.sh --verify-runtime

  # ---------------------------------------------------------------- linux --
  # The default lane (hosted linux/amd64 runners). Same commands the CI
  # gates always ran: fmt + clippy -D warnings + check/test --all-features +
  # doctor. Protocol/stream tests ride the --workspace all-features run.
  # Long lanes stay #[ignore]-gated.
  - name: linux
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    # The workspace test run includes crates/browser's BrokerOnly confinement
    # tests, whose spawn layer needs unshare(CLONE_NEWNET); Docker's default
    # capability set refuses it, so the step runs privileged. That is allowed
    # only because the TRUSTED project carries trusted.security=true
    # (admin-granted); pull_request events never reach this file/project.
    privileged: true
    when:
      matrix:
        platform: linux/amd64
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
      # Heavy daemon tests each spawn a db actor thread plus tokio workers;
      # the default nproc-way libtest parallelism livelocked
      # tests::prompt_runs_a_real_turn_and_reports_the_final_state (futex
      # ping-pong between the prompt thread and the actor, no I/O, 30+ min)
      # on the shared runner while the same test passes in isolation. Two
      # workers keeps each actor's timing loop live. `CARGO_BUILD_JOBS` caps
      # rustc fan-out for the same reason (shared host with the darwin lane).
      RUST_TEST_THREADS: "2"
      CARGO_BUILD_JOBS: "4"
    volumes:
      - faktor-trusted-cargo-registry:/usr/local/cargo/registry
      - faktor-trusted-cargo-git:/usr/local/cargo/git
      - faktor-trusted-target-linux:/woodpecker-cache/target
    commands:
      # No apt: the digest-pinned rust:1.98.0 baseline already ships python3,
      # procps and ca-certificates (verified: `python3`, `ps`, unzip, curl and
      # /etc/ssl/certs/ca-certificates.crt are present). Toolchain authority
      # stays rust-toolchain.toml.
      # rust-toolchain.toml is authoritative; fail loudly if the shim does not resolve it.
      - rustup show active-toolchain
      - rustup component add rustfmt clippy
      - cargo fmt --check
      - cargo check --workspace --all-features
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
      - cargo test --workspace --all-features
      - cargo run -p faktor-cli -- doctor --data-dir /tmp/faktor-ci
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        rustup show active-toolchain
        rustup component add rustfmt clippy
        cargo fmt --check
        cargo check --workspace --all-features
        cargo clippy --workspace --all-targets --all-features -- -D warnings
        cargo test --workspace --all-features
        cargo run -p faktor-cli -- doctor --data-dir /tmp/faktor-ci
        CMDS
        )"
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane linux --status passed \
          --out target/certification/lanes/linux.json
  - name: static
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    when:
      matrix:
        platform: linux/amd64
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
      # Shared self-hosted runner: the darwin lane's tests run on the same
      # host while these containers build, so cap rustc fan-out and keep the
      # fixture children schedulable (bounded, documented resource setting —
      # no test is excluded).
      CARGO_BUILD_JOBS: "4"
    volumes:
      - faktor-trusted-cargo-registry:/usr/local/cargo/registry
      - faktor-trusted-cargo-git:/usr/local/cargo/git
      - faktor-trusted-target-static:/woodpecker-cache/target
    commands:
      - cargo test -p faktor-tests-static-authority
      - cargo test -p faktor-security
      - cargo test -p faktor-tests-fuzz-seeds
      # Central provider classifier: the exhaustive status x hint truth table
      # (audit P1: 400 + structured rate-limit/quota hints stay retryable).
      - cargo test -p faktor-provider --lib classify
      # Frozen contracts: regenerate every vocabulary from the COMPILED types
      # and fail on any rename/reorder in docs/contracts. This is the
      # cargo-capable half; the certificate lane re-hashes the frozen bytes
      # and binds the digest into the certificate evidence.
      - cargo run -p faktor-contracts -- check
      # License / bans / sources policy (root deny.toml) evaluated against the
      # locked cargo metadata graph; cargo-deny itself re-checks when present.
      - bash scripts/check-licenses.sh
      - SUPPLY_CHAIN_BUILD=1 SUPPLY_CHAIN_ARTIFACTS="$CARGO_TARGET_DIR/release/faktor-cli" bash scripts/supply-chain.sh
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cargo test -p faktor-tests-static-authority
        cargo test -p faktor-security
        cargo test -p faktor-tests-fuzz-seeds
        cargo run -p faktor-contracts -- check
        bash scripts/check-licenses.sh
        SUPPLY_CHAIN_BUILD=1 SUPPLY_CHAIN_ARTIFACTS="$CARGO_TARGET_DIR/release/faktor-cli" bash scripts/supply-chain.sh
        CMDS
        )"
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane static --status passed \
          --out target/certification/lanes/static.json
  - name: docs
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    when:
      matrix:
        platform: linux/amd64
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
      # Shared self-hosted runner: the darwin lane's tests run on the same
      # host while these containers build, so cap rustc fan-out and keep the
      # fixture children schedulable (bounded, documented resource setting —
      # no test is excluded).
      CARGO_BUILD_JOBS: "4"
    volumes:
      - faktor-trusted-cargo-registry:/usr/local/cargo/registry
      - faktor-trusted-cargo-git:/usr/local/cargo/git
      - faktor-trusted-target-docs:/woodpecker-cache/target
    commands:
      - cargo doc --workspace --all-features --no-deps
      - bash scripts/branding-scan.sh
      - bash scripts/check-docs-sync.sh
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cargo doc --workspace --all-features --no-deps
        bash scripts/branding-scan.sh
        bash scripts/check-docs-sync.sh
        CMDS
        )"
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane docs --status passed \
          --out target/certification/lanes/docs.json
  # Per-release accelerated churn (scripts/soak.sh --mode churn): the
  # convergence churn workload runs for FAKTOR_SOAK_CHURN_SECONDS with the
  # mandatory quiescent-convergence checker. Every recorded metric must pass
  # (RSS/FD bands, zero children/background tasks, drained writer/reader
  # queues, WAL/temp/CAS convergence, no journal/index latency trend,
  # reconnect correctness); missing samples are a typed failure, never a
  # skip. The real-time 12-24h run is the nightly `soak` lane.
  - name: soak-smoke
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    when:
      matrix:
        platform: linux/amd64
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
      FAKTOR_SOAK_MODE: churn
      FAKTOR_SOAK_CHURN_SECONDS: "1800"
      FAKTOR_SOAK_CONVERGENCE: required
      FAKTOR_SOAK_LANE: soak-smoke
      # Bounded even though the first (cold) release build dominates: a
      # non-positive budget is refused, a zero-test run fails the step, and a
      # failed convergence metric fails the lane.
      FAKTOR_SOAK_MAX_WALL_SECONDS: "3600"
      FAKTOR_SOAK_TEST_TIMEOUT_SECONDS: "3300"
    volumes:
      - faktor-trusted-cargo-registry:/usr/local/cargo/registry
      - faktor-trusted-cargo-git:/usr/local/cargo/git
      - faktor-trusted-target-soak-smoke:/woodpecker-cache/target
    commands:
      - bash scripts/soak.sh --mode churn -p faktor-tests-soak --release -- --ignored --exact soak_convergence_churn
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        bash scripts/soak.sh --mode churn -p faktor-tests-soak --release -- --ignored --exact soak_convergence_churn
        CMDS
        )"
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane soak-smoke --status passed \
          --artifact target/certification/soak.json \
          --out target/certification/lanes/soak-smoke.json
  - name: vscode
    image: node:24@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4 # node:24 @ 2026-09-23
    when:
      matrix:
        platform: linux/amd64
    volumes:
      - faktor-trusted-npm-cache:/root/.npm
    commands:
      # No apt: the digest-pinned node:24 baseline already ships unzip and
      # ca-certificates (verified: `unzip`, `python3`, curl and
      # /etc/ssl/certs/ca-certificates.crt are present).
      # Audit 25: the generated protocol DTO/parsers must match the checked-in
      # canonical schema artifact (the artifact-vs-emitter half runs in the
      # cargo lane via `cargo test -p faktor-protocol`).
      - node scripts/protocol-codegen.mjs --check-clients
      - cd apps/vscode
      - npm ci
      - npm run build
      - node scripts/selftest.mjs
      - npx --no-install vsce package --out faktor-ci.vsix
      - node scripts/verify-vsix.mjs faktor-ci.vsix --min-media-files 4
      - rm -rf /tmp/faktor-vsix && mkdir -p /tmp/faktor-vsix && unzip -q faktor-ci.vsix -d /tmp/faktor-vsix
      - node scripts/verify-vsix.mjs faktor-ci.vsix --extract-dir /tmp/faktor-vsix/extension
      - node scripts/selftest.mjs --packaged /tmp/faktor-vsix/extension
      - node scripts/verify-vsix.mjs faktor-ci.vsix --ide-load
      - cd "$CI_WORKSPACE"
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        node scripts/protocol-codegen.mjs --check-clients
        cd apps/vscode
        npm ci
        npm run build
        node scripts/selftest.mjs
        npx --no-install vsce package --out faktor-ci.vsix
        node scripts/verify-vsix.mjs faktor-ci.vsix --min-media-files 4
        rm -rf /tmp/faktor-vsix && mkdir -p /tmp/faktor-vsix && unzip -q faktor-ci.vsix -d /tmp/faktor-vsix
        node scripts/verify-vsix.mjs faktor-ci.vsix --extract-dir /tmp/faktor-vsix/extension
        node scripts/selftest.mjs --packaged /tmp/faktor-vsix/extension
        node scripts/verify-vsix.mjs faktor-ci.vsix --ide-load
        cd "$CI_WORKSPACE"
        CMDS
        )"
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane vscode --status passed \
          --artifact apps/vscode/faktor-ci.vsix \
          --out target/certification/lanes/vscode.json
  # Real VS Code Extension Host / webview E2E behind the VS Code lane. Runs
  # `--extensionDevelopmentPath=apps/vscode` against a PINNED linux-x64 VS Code
  # tarball (version+commit+sha256 recorded in scripts/vscode-e2e.sh, sha
  # verified before extraction) and executes scripts/vscode-e2e/extension-host-
  # smoke.cjs INSIDE the real extension host: extension activated, commands
  # registered, compiled webview provider HTML carries the strict CSP plus the
  # composer/attachment surface. It is NOT a screenshot/pixel comparison and
  # does not display the workbench UI (the record states its exact coverage).
  # This image is digest-pinned because the Electron extension host needs the
  # Chromium runtime libraries, which the node:24 baseline does not ship and
  # which are installed via NO apt step here.
  - name: vscode-e2e
    image: mcr.microsoft.com/playwright:v1.55.0-noble@sha256:b27e719ecbfef153e13fd24e8341736733bf2658b229677eb21ff57ff5d7fb29 # mcr.microsoft.com/playwright:v1.55.0-noble @ 2026-10-02
    depends_on: [vscode]
    when:
      matrix:
        platform: linux/amd64
    volumes:
      - faktor-trusted-vscode-e2e-cache:/woodpecker-cache/vscode-e2e
    commands:
      - bash scripts/vscode-e2e.sh --cache-dir /woodpecker-cache/vscode-e2e/cache
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        bash scripts/vscode-e2e.sh --cache-dir /woodpecker-cache/vscode-e2e/cache
        CMDS
        )"
        # The playwright image may lack git; the vscode lane's marker (this
        # lane depends_on vscode) carries the same tree.
        tree="$(git rev-parse 'HEAD^{tree}' 2>/dev/null || true)"
        if [ -z "$tree" ] && [ -f target/certification/lanes/vscode.json ]; then
          tree="$(sed -n 's/.*"tree":"\([^"]*\)".*/\1/p' target/certification/lanes/vscode.json | head -n 1)"
        fi
        [ -n "$tree" ] || tree="unknown"
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane vscode-e2e --status passed --tree "$tree" \
          --artifact target/certification/vscode-e2e.json \
          --out target/certification/lanes/vscode-e2e.json
  - name: jetbrains-build
    # Runs on the digest-pinned Faktor CI image: it carries git (the lane
    # marker's `git rev-parse 'HEAD^{tree}'` tree binding) and the JDK 17
    # that the pinned Gradle wrapper (9.7.1) requires.
    image: ghcr.io/sbelakho2/faktor-ci@sha256:04d473828cc7634f0168a62c9340f1cf3d585f97adc655755f780af82bd6ee13 # faktor-ci (linux/amd64) built from docker/faktor-ci/Dockerfile; digest recorded in docker/faktor-ci/image-digest.txt; pull:false requires the locally produced image
    pull: false
    depends_on: [ci-image]
    when:
      matrix:
        platform: linux/amd64
    volumes:
      - faktor-trusted-gradle-home:/root/.gradle
    commands:
      - cd apps/jetbrains
      # Validate wrapper jar + distribution sha256 + verification metadata + locks first.
      - bash ../../scripts/check-gradle-integrity.sh
      - ./gradlew :frontend:buildPlugin --no-daemon --stacktrace
      - cd "$CI_WORKSPACE"
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cd apps/jetbrains
        bash ../../scripts/check-gradle-integrity.sh
        ./gradlew :frontend:buildPlugin --no-daemon --stacktrace
        cd "$CI_WORKSPACE"
        CMDS
        )"
        artifact_path="$(find apps/jetbrains/frontend/build/distributions -maxdepth 1 -name '*.zip' -print -quit 2>/dev/null || true)"
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane jetbrains-build --status passed \
          --optional-artifact "$artifact_path" \
          --out target/certification/lanes/jetbrains-build.json
  - name: jetbrains-smoke
    image: ghcr.io/sbelakho2/faktor-ci@sha256:04d473828cc7634f0168a62c9340f1cf3d585f97adc655755f780af82bd6ee13 # faktor-ci (linux/amd64) built from docker/faktor-ci/Dockerfile; digest recorded in docker/faktor-ci/image-digest.txt; pull:false requires the locally produced image
    pull: false
    # `jetbrains-build` produces the plugin ZIP this lane proves: the host
    # matrix runs against the BUILT ZIP (never source classes), so the ZIP is
    # a hard dependency and FAKTOR_JETBRAINS_REQUIRE_PLUGIN_ZIP=1 makes a
    # missing ZIP a typed failure, never a silent source-only downgrade.
    depends_on: [ci-image, jetbrains-build]
    when:
      matrix:
        platform: linux/amd64
    environment:
      RUST_BACKTRACE: "1"
    volumes:
      - faktor-trusted-cargo-registry:/usr/local/cargo/registry
      - faktor-trusted-cargo-git:/usr/local/cargo/git
    commands:
      # No apt: the digest-pinned Faktor CI image already carries the pinned
      # toolchain (kotlin, openjdk-11-jre-headless, openjdk-17-jdk-headless,
      # git, build-essential, curl, pkg-config, libssl-dev). The `ci-image`
      # pre-step fails the pipeline closed when the image was not
      # produced/pulled.
      - |
        set -eu
        curl --proto '=https' --tlsv1.2 -fsSLo /tmp/rustup-init https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init
        printf '%s  %s\n' 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c /tmp/rustup-init | sha256sum -c -
        chmod +x /tmp/rustup-init
        RUST_CHANNEL="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
        [ -n "$RUST_CHANNEL" ] || { echo "rust-toolchain.toml: missing channel" >&2; exit 1; }
        /tmp/rustup-init -y --profile minimal --default-toolchain "$RUST_CHANNEL"
      - . "$HOME/.cargo/env"
      - FAKTOR_JETBRAINS_REQUIRE_PLUGIN_ZIP=1 bash apps/jetbrains/compile-and-smoke.sh
      # Node (pinned, sha256-verified) for the executable planted-mutation
      # campaign: this lane is the only one carrying cargo, JDK/gradle and
      # Node together.
      - |
        set -eu
        curl --proto '=https' --tlsv1.2 -fsSLo /tmp/node.tar.xz https://nodejs.org/dist/v24.11.1/node-v24.11.1-linux-x64.tar.xz
        printf '%s  %s\n' 60e3b0a8500819514aca603487c254298cd776de0698d3cd08f11dba5b8289a8 /tmp/node.tar.xz | sha256sum -c -
        tar -xJf /tmp/node.tar.xz -C /opt
      - export PATH="/opt/node-v24.11.1-linux-x64/bin:$PATH" && node --version && node scripts/check-invariants.mjs --mutations
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        set -eu
        curl --proto '=https' --tlsv1.2 -fsSLo /tmp/rustup-init https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init
        printf '%s  %s\n' 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c /tmp/rustup-init | sha256sum -c -
        chmod +x /tmp/rustup-init
        RUST_CHANNEL="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
        [ -n "$RUST_CHANNEL" ] || { echo "rust-toolchain.toml: missing channel" >&2; exit 1; }
        /tmp/rustup-init -y --profile minimal --default-toolchain "$RUST_CHANNEL"
        . "$HOME/.cargo/env"
        FAKTOR_JETBRAINS_REQUIRE_PLUGIN_ZIP=1 bash apps/jetbrains/compile-and-smoke.sh
        set -eu
        curl --proto '=https' --tlsv1.2 -fsSLo /tmp/node.tar.xz https://nodejs.org/dist/v24.11.1/node-v24.11.1-linux-x64.tar.xz
        printf '%s  %s\n' 60e3b0a8500819514aca603487c254298cd776de0698d3cd08f11dba5b8289a8 /tmp/node.tar.xz | sha256sum -c -
        tar -xJf /tmp/node.tar.xz -C /opt
        export PATH="/opt/node-v24.11.1-linux-x64/bin:$PATH" && node --version && node scripts/check-invariants.mjs --mutations
        CMDS
        )"
        printf '%s' "$CMDS" | sh scripts/certification/lane-marker.sh write \
          --lane jetbrains-smoke --status passed \
          --artifact target/certification/jetbrains-host-matrix.json \
          --out target/certification/lanes/jetbrains-smoke.json
