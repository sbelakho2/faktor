  - name: release-artifacts
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    depends_on: [static, vscode, jetbrains-build]
    when:
      matrix:
        platform: linux/amd64
      status: [success]
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TARGET_DIR: /woodpecker-cache/target
      CARGO_BUILD_JOBS: "4"
    volumes:
      - faktor-trusted-cargo-registry:/usr/local/cargo/registry
      - faktor-trusted-cargo-git:/usr/local/cargo/git
      # The static lane's supply-chain build already compiled the release
      # CLI into this cache; the build below is at most incremental.
      - faktor-trusted-target-static:/woodpecker-cache/target
      # Host-extractable copy of the EXACT bytes the attestation hashes:
      # the trusted release artifact set (faktor-cli, VSIX, JetBrains zip).
      - faktor-trusted-release-artifacts:/release-artifacts
    commands:
      - cargo build --release -p faktor-cli
      - mkdir -p target/release && cp "$CARGO_TARGET_DIR/release/faktor-cli" target/release/faktor-cli
      - |
        set -eu
        mkdir -p target/certification/lanes /release-artifacts
        cli_sha="$(sha256sum target/release/faktor-cli | cut -d' ' -f1)"
        vsix_path="$(ls apps/vscode/*.vsix | head -n 1)"
        zip_path="$(find apps/jetbrains -type f -path '*/build/distributions/*.zip' | head -n 1)"
        [ -n "$vsix_path" ] && [ -n "$zip_path" ] || { echo "release-artifacts: packaged outputs missing" >&2; exit 1; }
        for rel in target/release/faktor-cli "$vsix_path" "$zip_path"; do
          mkdir -p "/release-artifacts/$(dirname "$rel")"
          cp "$rel" "/release-artifacts/$rel"
        done
        CMDS="$(cat <<'CMDS'
        cargo build --release -p faktor-cli
        mkdir -p target/release && cp "$CARGO_TARGET_DIR/release/faktor-cli" target/release/faktor-cli
        CMDS
