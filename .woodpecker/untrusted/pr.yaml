# Faktor CI — pull_request workflow for the UNTRUSTED Woodpecker project.
#
# TRUST BOUNDARY (mechanical, server-side): this file lives at the pipeline
# path of a project whose server-side setting is trusted=false. Woodpecker
# refuses `volumes:` for such a project at policy level, so a PR that edits
# this file cannot obtain a volume mount. Trust and the pipeline path are
# project settings on the server; a PR diff cannot change either one. The
# TRUSTED project points only at `.woodpecker/trusted/`, so pull_request
# events can never reach the caches. See scripts/woodpecker/setup.md §5.
#
# UNTRUSTED EVENT: EPHEMERAL STORAGE ONLY. This file must never declare
# `volumes:` and must never set CARGO_TARGET_DIR to a named-volume path.
# Everything a PR job writes stays inside the per-pipeline workspace and is
# discarded when the pipeline ends. The trusted caches (`faktor-trusted-*`,
# used by `.woodpecker/trusted/trusted.yaml`) and the cron caches
# (`faktor-nightly-*`) are therefore out of reach of PR code.
#
# The step set is deliberately reduced: the release `[perf]` budgets (and the
# trusted/platform certificates) belong to the trusted project; a PR still
# runs the full correctness set (fmt/clippy/check/test/doctor,
# static+security+fuzz, docs-sync, VSIX build+verify, required chromium render
# gate, JetBrains build+smoke) without a warm cache.
#
# Bootstrap audit: this workflow contains NO `curl … | sh`-style step. The
# one remaining toolchain bootstrap (JetBrains smoke) downloads the pinned
# rustup-init binary, verifies its published SHA-256, and then executes it.
#
# Toolchain authority: `rust-toolchain.toml` pins channel 1.98.0 with
# components rustfmt+clippy (profile minimal). The `rust:1.98.0` image is
# only a rustup baseline: the cargo/rustc shims resolve the exact channel
# from the toolchain file, and the linux lane asserts that resolution before
# running the gates. The JetBrains smoke lane derives its rustup-init
# `--default-toolchain` from the same file — never a second hard-coded Rust
# version.
#
# Image pinning: EVERY container image in every workflow is pinned by its
# multi-arch index digest (the trailing comment records the original tag and
# the date the digest was recorded), including the Rust baseline image.
# `scripts/check-ci-image-pins.sh` enforces this in the `image-pins` step: an
# image line without `@sha256:` fails the pipeline unless it is explicitly
# annotated `digest-exempt: <reason>` (the Windows self-hosted `powershell`
# image is the only exemption). The toolchain file, not the image, remains
# the Rust channel authority.
#
# Commit-status context (default `WOODPECKER_STATUS_CONTEXT_FORMAT`):
#   ci/woodpecker/pr/pr — this is the context branch protection requires.

labels:
  platform: linux/amd64

when:
  - event: pull_request

steps:
  # ------------------------------------------------------ storage policy --
  # Defense-in-depth ONLY (a PR can delete this guard). The actual boundary
  # is the untrusted project's server-side trusted=false + pipeline path.
  - name: storage-policy
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc # alpine:3.20 @ 2026-09-23
    commands:
      - |
        set -eu
        if grep -nE '^[[:space:]]*volumes:' .woodpecker/untrusted/pr.yaml; then
          echo "POLICY VIOLATION: .woodpecker/untrusted/pr.yaml must not declare volumes (untrusted event)" >&2
          exit 1
        fi
        if grep -vE '^[[:space:]]*#' .woodpecker/untrusted/pr.yaml | grep -nE 'faktor-(trusted|nightly)-'; then
          echo "POLICY VIOLATION: .woodpecker/untrusted/pr.yaml must not reference trusted/cron cache volumes" >&2
          exit 1
        fi
        # No workflow may sit at the top level: both projects must select an
        # explicit, server-side pipeline path (`.woodpecker/untrusted/` or
        # `.woodpecker/trusted/`). The top-level entries are inert symlinks
        # kept for in-repo tooling; a regular file there would be loadable by
        # a default-path project and is treated as a violation.
        stray="$(find .woodpecker -maxdepth 1 -type f \( -name '*.yaml' -o -name '*.yml' \) -print 2>/dev/null || true)"
        if [ -n "$stray" ]; then
          echo "POLICY VIOLATION: workflow file(s) at the .woodpecker/ top level: $stray" >&2
          exit 1
        fi
        for link in .woodpecker/pr.yaml .woodpecker/trusted.yaml .woodpecker/nightly.yaml; do
          if [ -e "$link" ] && [ ! -L "$link" ]; then
            echo "POLICY VIOLATION: $link must be a symlink (or absent), never a real workflow file" >&2
            exit 1
          fi
        done
        echo "storage policy: PR workflow declares no volumes; project layout intact"

  # ---------------------------------------------------------- image pins --
  # Every image in every workflow must be digest-pinned (the Windows
  # self-hosted powershell line is the only documented digest-exempt case).
  - name: image-pins
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc # alpine:3.20 @ 2026-09-23
    commands:
      - sh scripts/check-ci-image-pins.sh

  # ---------------------------------------------------------------- linux --
  - name: linux
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    environment:
      RUST_BACKTRACE: "1"
    commands:
      # apt-snapshot: 20260923T000000Z Debian trixie snapshot + exact versions; no live repos (docs/certification.md §2.14)
      - |
        set -eu
        SNAPSHOT=https://snapshot.debian.org/archive/debian/20260923T000000Z
        SNAPSHOT_SECURITY=https://snapshot.debian.org/archive/debian-security/20260923T000000Z
        printf 'deb [check-valid-until=no] %s trixie main\n' "$SNAPSHOT" > /etc/apt/sources.list.d/faktor-snapshot.list
        printf 'deb [check-valid-until=no] %s trixie-updates main\n' "$SNAPSHOT" >> /etc/apt/sources.list.d/faktor-snapshot.list
        printf 'deb [check-valid-until=no] %s trixie-security main\n' "$SNAPSHOT_SECURITY" >> /etc/apt/sources.list.d/faktor-snapshot.list
        rm -f /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources
        apt-get update
        apt-get install -y --no-install-recommends python3=3.13.5-1 procps=2:4.0.4-9 ca-certificates=20250419
      # rust-toolchain.toml is authoritative; fail loudly if the shim does not resolve it.
      - rustup show active-toolchain
      - rustup component add rustfmt clippy
      - cargo fmt --check
      - cargo check --workspace --all-features
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
      - cargo test --workspace --all-features
      - cargo run -p faktor-cli -- doctor --data-dir /tmp/faktor-ci
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        set -eu
        SNAPSHOT=https://snapshot.debian.org/archive/debian/20260923T000000Z
        SNAPSHOT_SECURITY=https://snapshot.debian.org/archive/debian-security/20260923T000000Z
        printf 'deb [check-valid-until=no] %s trixie main\n' "$SNAPSHOT" > /etc/apt/sources.list.d/faktor-snapshot.list
        printf 'deb [check-valid-until=no] %s trixie-updates main\n' "$SNAPSHOT" >> /etc/apt/sources.list.d/faktor-snapshot.list
        printf 'deb [check-valid-until=no] %s trixie-security main\n' "$SNAPSHOT_SECURITY" >> /etc/apt/sources.list.d/faktor-snapshot.list
        rm -f /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources
        apt-get update
        apt-get install -y --no-install-recommends python3=3.13.5-1 procps=2:4.0.4-9 ca-certificates=20250419
        rustup show active-toolchain
        rustup component add rustfmt clippy
        cargo fmt --check
        cargo check --workspace --all-features
        cargo clippy --workspace --all-targets --all-features -- -D warnings
        cargo test --workspace --all-features
        cargo run -p faktor-cli -- doctor --data-dir /tmp/faktor-ci
        CMDS
        )"
        cmds_digest="sha256:$(printf '%s' "$CMDS" | sha256sum | cut -d' ' -f1)"
        cmds_b64="$(printf '%s' "$CMDS" | base64 | tr -d '\n')"
        iso_ts() { t="$1"; if [ -n "$t" ]; then date -u -r "$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ; else date -u +%Y-%m-%dT%H:%M:%SZ; fi; }
        started_at="$(iso_ts "${CI_PIPELINE_STARTED:-}")"
        finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tree="$(git rev-parse 'HEAD^{tree}')"
        artifacts="[]"
        artifact_digest="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        printf '{"schema":"faktor-woodpecker-lane/v2","lane":"linux","status":"passed","commit":"%s","tree":"%s","runner":{"os":"%s","arch":"%s","ci":"woodpecker","run_id":"%s"},"started_at":"%s","finished_at":"%s","commands_b64":"%s","commands_digest":"sha256:%s","artifacts":%s,"artifact_digest":"sha256:%s"}\n' \
          "$CI_COMMIT_SHA" "$tree" "$(uname -s | tr '[:upper:]' '[:lower:]')" "$(uname -m)" "${CI_PIPELINE_NUMBER:-0}" "$started_at" "$finished_at" "$cmds_b64" "$cmds_digest" "$artifacts" "$artifact_digest" > target/certification/lanes/linux.json
  - name: static
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    environment:
      RUST_BACKTRACE: "1"
    commands:
      - cargo test -p faktor-tests-static-authority
      - cargo test -p faktor-security
      - cargo test -p faktor-tests-fuzz-seeds
      - SUPPLY_CHAIN_BUILD=1 SUPPLY_CHAIN_ARTIFACTS="target/release/faktor-cli" bash scripts/supply-chain.sh
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cargo test -p faktor-tests-static-authority
        cargo test -p faktor-security
        cargo test -p faktor-tests-fuzz-seeds
        SUPPLY_CHAIN_BUILD=1 SUPPLY_CHAIN_ARTIFACTS="target/release/faktor-cli" bash scripts/supply-chain.sh
        CMDS
        )"
        cmds_digest="sha256:$(printf '%s' "$CMDS" | sha256sum | cut -d' ' -f1)"
        cmds_b64="$(printf '%s' "$CMDS" | base64 | tr -d '\n')"
        iso_ts() { t="$1"; if [ -n "$t" ]; then date -u -r "$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ; else date -u +%Y-%m-%dT%H:%M:%SZ; fi; }
        started_at="$(iso_ts "${CI_PIPELINE_STARTED:-}")"
        finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tree="$(git rev-parse 'HEAD^{tree}')"
        artifacts="[]"
        artifact_digest="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        printf '{"schema":"faktor-woodpecker-lane/v2","lane":"static","status":"passed","commit":"%s","tree":"%s","runner":{"os":"%s","arch":"%s","ci":"woodpecker","run_id":"%s"},"started_at":"%s","finished_at":"%s","commands_b64":"%s","commands_digest":"sha256:%s","artifacts":%s,"artifact_digest":"sha256:%s"}\n' \
          "$CI_COMMIT_SHA" "$tree" "$(uname -s | tr '[:upper:]' '[:lower:]')" "$(uname -m)" "${CI_PIPELINE_NUMBER:-0}" "$started_at" "$finished_at" "$cmds_b64" "$cmds_digest" "$artifacts" "$artifact_digest" > target/certification/lanes/static.json
  - name: docs
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    environment:
      RUST_BACKTRACE: "1"
    commands:
      - cargo doc --workspace --all-features --no-deps
      - bash scripts/branding-scan.sh
      - bash scripts/check-docs-sync.sh
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cargo doc --workspace --all-features --no-deps
        bash scripts/branding-scan.sh
        bash scripts/check-docs-sync.sh
        CMDS
        )"
        cmds_digest="sha256:$(printf '%s' "$CMDS" | sha256sum | cut -d' ' -f1)"
        cmds_b64="$(printf '%s' "$CMDS" | base64 | tr -d '\n')"
        iso_ts() { t="$1"; if [ -n "$t" ]; then date -u -r "$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ; else date -u +%Y-%m-%dT%H:%M:%SZ; fi; }
        started_at="$(iso_ts "${CI_PIPELINE_STARTED:-}")"
        finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tree="$(git rev-parse 'HEAD^{tree}')"
        artifacts="[]"
        artifact_digest="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        printf '{"schema":"faktor-woodpecker-lane/v2","lane":"docs","status":"passed","commit":"%s","tree":"%s","runner":{"os":"%s","arch":"%s","ci":"woodpecker","run_id":"%s"},"started_at":"%s","finished_at":"%s","commands_b64":"%s","commands_digest":"sha256:%s","artifacts":%s,"artifact_digest":"sha256:%s"}\n' \
          "$CI_COMMIT_SHA" "$tree" "$(uname -s | tr '[:upper:]' '[:lower:]')" "$(uname -m)" "${CI_PIPELINE_NUMBER:-0}" "$started_at" "$finished_at" "$cmds_b64" "$cmds_digest" "$artifacts" "$artifact_digest" > target/certification/lanes/docs.json
  - name: vscode
    image: node:24@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4 # node:24 @ 2026-09-23
    commands:
      # apt-snapshot: 20260923T000000Z Debian bookworm snapshot + exact versions; no live repos (docs/certification.md §2.14)
      - |
        set -eu
        SNAPSHOT=https://snapshot.debian.org/archive/debian/20260923T000000Z
        SNAPSHOT_SECURITY=https://snapshot.debian.org/archive/debian-security/20260923T000000Z
        printf 'deb [check-valid-until=no] %s bookworm main\n' "$SNAPSHOT" > /etc/apt/sources.list.d/faktor-snapshot.list
        printf 'deb [check-valid-until=no] %s bookworm-updates main\n' "$SNAPSHOT" >> /etc/apt/sources.list.d/faktor-snapshot.list
        printf 'deb [check-valid-until=no] %s bookworm-security main\n' "$SNAPSHOT_SECURITY" >> /etc/apt/sources.list.d/faktor-snapshot.list
        rm -f /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources
        apt-get update
        apt-get install -y --no-install-recommends unzip=6.0-28+deb12u1 ca-certificates=20250419~deb12u1
      - cd apps/vscode
      - npm ci
      - npm run build
      - node scripts/selftest.mjs
      - npx --no-install vsce package --out faktor-ci.vsix
      - node scripts/verify-vsix.mjs faktor-ci.vsix --min-media-files 4
      - rm -rf /tmp/faktor-vsix && mkdir -p /tmp/faktor-vsix && unzip -q faktor-ci.vsix -d /tmp/faktor-vsix
      - node scripts/verify-vsix.mjs faktor-ci.vsix --extract-dir /tmp/faktor-vsix/extension
      - node scripts/selftest.mjs --packaged /tmp/faktor-vsix/extension
      - node scripts/verify-vsix.mjs faktor-ci.vsix --ide-load
      - cd "$CI_WORKSPACE"
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        set -eu
        SNAPSHOT=https://snapshot.debian.org/archive/debian/20260923T000000Z
        SNAPSHOT_SECURITY=https://snapshot.debian.org/archive/debian-security/20260923T000000Z
        printf 'deb [check-valid-until=no] %s bookworm main\n' "$SNAPSHOT" > /etc/apt/sources.list.d/faktor-snapshot.list
        printf 'deb [check-valid-until=no] %s bookworm-updates main\n' "$SNAPSHOT" >> /etc/apt/sources.list.d/faktor-snapshot.list
        printf 'deb [check-valid-until=no] %s bookworm-security main\n' "$SNAPSHOT_SECURITY" >> /etc/apt/sources.list.d/faktor-snapshot.list
        rm -f /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources
        apt-get update
        apt-get install -y --no-install-recommends unzip=6.0-28+deb12u1 ca-certificates=20250419~deb12u1
        cd apps/vscode
        npm ci
        npm run build
        node scripts/selftest.mjs
        npx --no-install vsce package --out faktor-ci.vsix
        node scripts/verify-vsix.mjs faktor-ci.vsix --min-media-files 4
        rm -rf /tmp/faktor-vsix && mkdir -p /tmp/faktor-vsix && unzip -q faktor-ci.vsix -d /tmp/faktor-vsix
        node scripts/verify-vsix.mjs faktor-ci.vsix --extract-dir /tmp/faktor-vsix/extension
        node scripts/selftest.mjs --packaged /tmp/faktor-vsix/extension
        node scripts/verify-vsix.mjs faktor-ci.vsix --ide-load
        cd "$CI_WORKSPACE"
        CMDS
        )"
        cmds_digest="sha256:$(printf '%s' "$CMDS" | sha256sum | cut -d' ' -f1)"
        cmds_b64="$(printf '%s' "$CMDS" | base64 | tr -d '\n')"
        iso_ts() { t="$1"; if [ -n "$t" ]; then date -u -r "$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ; else date -u +%Y-%m-%dT%H:%M:%SZ; fi; }
        started_at="$(iso_ts "${CI_PIPELINE_STARTED:-}")"
        finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tree="$(git rev-parse 'HEAD^{tree}')"
        artifact_path="apps/vscode/faktor-ci.vsix"
        artifact_sha="$(sha256sum "$artifact_path" | cut -d' ' -f1)"
        artifacts="[{\"path\":\"$artifact_path\",\"sha256\":\"sha256:$artifact_sha\"}]"
        artifact_digest="$(printf 'sha256:%s\t%s\n' "$artifact_sha" "$artifact_path" | sha256sum | cut -d' ' -f1)"
        printf '{"schema":"faktor-woodpecker-lane/v2","lane":"vscode","status":"passed","commit":"%s","tree":"%s","runner":{"os":"%s","arch":"%s","ci":"woodpecker","run_id":"%s"},"started_at":"%s","finished_at":"%s","commands_b64":"%s","commands_digest":"sha256:%s","artifacts":%s,"artifact_digest":"sha256:%s"}\n' \
          "$CI_COMMIT_SHA" "$tree" "$(uname -s | tr '[:upper:]' '[:lower:]')" "$(uname -m)" "${CI_PIPELINE_NUMBER:-0}" "$started_at" "$finished_at" "$cmds_b64" "$cmds_digest" "$artifacts" "$artifact_digest" > target/certification/lanes/vscode.json
  - name: jetbrains-build
    image: eclipse-temurin:17-jdk@sha256:bc033b57e11b773c3043babfd664e7a5ef110805548b921cbfc3e8c67a0725d6 # eclipse-temurin:17-jdk @ 2026-09-23
    commands:
      - cd apps/jetbrains
      # Validate wrapper jar + distribution sha256 + verification metadata + locks first.
      - bash ../../scripts/check-gradle-integrity.sh
      - ./gradlew :frontend:buildPlugin --no-daemon --stacktrace
      - cd "$CI_WORKSPACE"
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cd apps/jetbrains
        bash ../../scripts/check-gradle-integrity.sh
        ./gradlew :frontend:buildPlugin --no-daemon --stacktrace
        cd "$CI_WORKSPACE"
        CMDS
        )"
        cmds_digest="sha256:$(printf '%s' "$CMDS" | sha256sum | cut -d' ' -f1)"
        cmds_b64="$(printf '%s' "$CMDS" | base64 | tr -d '\n')"
        iso_ts() { t="$1"; if [ -n "$t" ]; then date -u -r "$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ; else date -u +%Y-%m-%dT%H:%M:%SZ; fi; }
        started_at="$(iso_ts "${CI_PIPELINE_STARTED:-}")"
        finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tree="$(git rev-parse 'HEAD^{tree}')"
        artifact_path="$(find apps/jetbrains/frontend/build/distributions -maxdepth 1 -name '*.zip' -print -quit 2>/dev/null || true)"
        if [ -n "$artifact_path" ]; then
          artifact_sha="$(sha256sum "$artifact_path" | cut -d' ' -f1)"
          artifacts="[{\"path\":\"$artifact_path\",\"sha256\":\"sha256:$artifact_sha\"}]"
          artifact_digest="$(printf 'sha256:%s\t%s\n' "$artifact_sha" "$artifact_path" | sha256sum | cut -d' ' -f1)"
        else
          artifacts="[]"
          artifact_digest="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        fi
        printf '{"schema":"faktor-woodpecker-lane/v2","lane":"jetbrains-build","status":"passed","commit":"%s","tree":"%s","runner":{"os":"%s","arch":"%s","ci":"woodpecker","run_id":"%s"},"started_at":"%s","finished_at":"%s","commands_b64":"%s","commands_digest":"sha256:%s","artifacts":%s,"artifact_digest":"sha256:%s"}\n' \
          "$CI_COMMIT_SHA" "$tree" "$(uname -s | tr '[:upper:]' '[:lower:]')" "$(uname -m)" "${CI_PIPELINE_NUMBER:-0}" "$started_at" "$finished_at" "$cmds_b64" "$cmds_digest" "$artifacts" "$artifact_digest" > target/certification/lanes/jetbrains-build.json
  - name: jetbrains-smoke
    image: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3 # ubuntu:24.04 @ 2026-09-23
    environment:
      RUST_BACKTRACE: "1"
      DEBIAN_FRONTEND: noninteractive
    commands:
      # apt-snapshot: 20260923T000000Z Ubuntu noble snapshot (main+universe) + exact versions; no live repos (docs/certification.md §2.14)
      # ubuntu:24.04 ships no ca-certificates: the single ca-certificates
      # bootstrap fetch below trusts APT's InRelease signature (ubuntu-keyring
      # is in the base image); TLS verification is restored right after.
      - |
        set -eu
        SNAPSHOT=https://snapshot.ubuntu.com/ubuntu/20260923T000000Z
        printf 'deb [check-valid-until=no] %s noble main universe\n' "$SNAPSHOT" > /etc/apt/sources.list.d/faktor-snapshot.list
        printf 'deb [check-valid-until=no] %s noble-updates main universe\n' "$SNAPSHOT" >> /etc/apt/sources.list.d/faktor-snapshot.list
        printf 'deb [check-valid-until=no] %s noble-security main universe\n' "$SNAPSHOT" >> /etc/apt/sources.list.d/faktor-snapshot.list
        rm -f /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources
        printf 'Acquire::https::Verify-Peer "false";\nAcquire::https::Verify-Host "false";\n' > /etc/apt/apt.conf.d/99faktor-ca-bootstrap
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates=20260601~24.04.1
