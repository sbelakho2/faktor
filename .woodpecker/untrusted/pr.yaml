# Faktor CI — pull_request workflow for the UNTRUSTED Woodpecker project.
#
# TRUST BOUNDARY (mechanical, server-side): this file lives at the pipeline
# path of a project whose server-side setting is trusted=false. Woodpecker
# refuses `volumes:` for such a project at policy level, so a PR that edits
# this file cannot obtain a volume mount. Trust and the pipeline path are
# project settings on the server; a PR diff cannot change either one. The
# TRUSTED project points only at `.woodpecker/trusted/`, so pull_request
# events can never reach the caches. See scripts/woodpecker/setup.md §5.
#
# UNTRUSTED EVENT: EPHEMERAL STORAGE ONLY. This file must never declare
# `volumes:` and must never set CARGO_TARGET_DIR to a named-volume path.
# Everything a PR job writes stays inside the per-pipeline workspace and is
# discarded when the pipeline ends. The trusted caches (`faktor-trusted-*`,
# used by `.woodpecker/trusted/trusted.yaml`) and the cron caches
# (`faktor-nightly-*`) are therefore out of reach of PR code.
#
# The step set is deliberately reduced: long release lanes (and the
# trusted/platform certificates) belong to the trusted project; a PR still
# runs the full correctness set (fmt/clippy/check/test/doctor,
# static+security+fuzz, docs-sync, VSIX build+verify, the `vscode-render`
# chromium render gate, JetBrains build+smoke) without a warm cache. The
# chromium render gate is a real lane (`vscode-render`, below, on the same
# digest-pinned Playwright image as the trusted `vscode-e2e` lane), not a
# comment-only claim.
#
# Bootstrap audit: this workflow contains NO `curl … | sh`-style step. The
# one remaining toolchain bootstrap (JetBrains smoke) downloads the pinned
# rustup-init binary, verifies its published SHA-256, and then executes it.
#
# Toolchain authority: `rust-toolchain.toml` pins channel 1.98.0 with
# components rustfmt+clippy (profile minimal). The `rust:1.98.0` image is
# only a rustup baseline: the cargo/rustc shims resolve the exact channel
# from the toolchain file, and the linux lane asserts that resolution before
# running the gates. The JetBrains smoke lane derives its rustup-init
# `--default-toolchain` from the same file — never a second hard-coded Rust
# version.
#
# Image pinning: EVERY container image in every workflow is pinned by its
# multi-arch index digest (the trailing comment records the original tag and
# the date the digest was recorded), including the Rust baseline image.
# `scripts/check-ci-image-pins.sh` enforces this in the `image-pins` step: an
# image line without `@sha256:` fails the pipeline unless it is explicitly
# annotated `digest-exempt: <reason>` (the Windows self-hosted `powershell`
# image is the only exemption). The toolchain file, not the image, remains
# the Rust channel authority.
#
# Hermetic toolchain (P1): the PR lanes run NO apt either. The stock baselines
# already ship the tools their old apt steps installed (python3, ps, unzip,
# ca-certificates) and keep their digest pins because they install nothing;
# the JetBrains build and smoke lanes run on the dedicated Faktor CI image
# from `docker/faktor-ci/Dockerfile` (git + JDK 17 included), referenced by
# the digest recorded in
# `docker/faktor-ci/image-digest.txt`. The required `ci-image` pre-step runs
# ON that exact digest with `pull: false`; if the image was not produced on
# the agent the container cannot start and the pipeline fails closed — there
# is no live-apt fallback. Untrusted-lane apt-residual is tolerated by the
# pin gate only with a justification, never in a trusted lane.
#
# Commit-status context (default `WOODPECKER_STATUS_CONTEXT_FORMAT`):
#   ci/woodpecker/pr/pr — this is the context branch protection requires.

labels:
  platform: linux/amd64

when:
  - event: pull_request

steps:
  # ------------------------------------------------------ storage policy --
  # Defense-in-depth ONLY (a PR can delete this guard). The actual boundary
  # is the untrusted project's server-side trusted=false + pipeline path.
  - name: storage-policy
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc # alpine:3.20 @ 2026-09-23
    commands:
      - |
        set -eu
        if grep -nE '^[[:space:]]*volumes:' .woodpecker/untrusted/pr.yaml; then
          echo "POLICY VIOLATION: .woodpecker/untrusted/pr.yaml must not declare volumes (untrusted event)" >&2
          exit 1
        fi
        if grep -vE '^[[:space:]]*#' .woodpecker/untrusted/pr.yaml | grep -nE 'faktor-(trusted|nightly)-'; then
          echo "POLICY VIOLATION: .woodpecker/untrusted/pr.yaml must not reference trusted/cron cache volumes" >&2
          exit 1
        fi
        # No workflow may sit at the top level: both projects must select an
        # explicit, server-side pipeline path (`.woodpecker/untrusted/` or
        # `.woodpecker/trusted/`). The top-level entries are inert symlinks
        # kept for in-repo tooling; a regular file there would be loadable by
        # a default-path project and is treated as a violation.
        stray="$(find .woodpecker -maxdepth 1 -type f \( -name '*.yaml' -o -name '*.yml' \) -print 2>/dev/null || true)"
        if [ -n "$stray" ]; then
          echo "POLICY VIOLATION: workflow file(s) at the .woodpecker/ top level: $stray" >&2
          exit 1
        fi
        for link in .woodpecker/pr.yaml .woodpecker/trusted.yaml .woodpecker/nightly.yaml; do
          if [ -e "$link" ] && [ ! -L "$link" ]; then
            echo "POLICY VIOLATION: $link must be a symlink (or absent), never a real workflow file" >&2
            exit 1
          fi
        done
        echo "storage policy: PR workflow declares no volumes; project layout intact"

  # ---------------------------------------------------------- image pins --
  # Every image in every workflow must be digest-pinned (the Windows
  # self-hosted powershell line is the only documented digest-exempt case).
  - name: image-pins
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc # alpine:3.20 @ 2026-09-23
    commands:
      - sh scripts/check-ci-image-pins.sh

  # ------------------------------------------------------------- ci-image --
  # Required pre-step (P1 hermetic CI): the lanes that used to run apt now
  # run on the digest-pinned Faktor CI image. This step runs ON that exact
  # digest with pull disabled, so the pipeline fails closed when the image
  # cannot be produced/pulled — no lane falls back to live apt. It
  # re-verifies every exact package pin from the Dockerfile against the
  # running image and that apt points at the fixed snapshot only
  # (scripts/build-ci-image.sh --verify-runtime).
  - name: ci-image
    image: ghcr.io/sbelakho2/faktor-ci@sha256:bf7739456df1fc9aad818f4dc08990092f89d4c36785abedc14751441b143166 # faktor-ci (linux/amd64) built from docker/faktor-ci/Dockerfile; digest recorded in docker/faktor-ci/image-digest.txt
    pull: false
    commands:
      - sh scripts/build-ci-image.sh --verify-runtime

  # ---------------------------------------------------------------- linux --
  - name: linux
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    environment:
      RUST_BACKTRACE: "1"
    commands:
      # No apt: the digest-pinned rust:1.98.0 baseline already ships python3,
      # procps and ca-certificates (verified: `python3`, `ps`, unzip, curl and
      # /etc/ssl/certs/ca-certificates.crt are present); the stock image is
      # kept because the lane installs nothing.
      # rust-toolchain.toml is authoritative; fail loudly if the shim does not resolve it.
      - rustup show active-toolchain
      - rustup component add rustfmt clippy
      - cargo fmt --check
      # Both seam profiles: the fault campaign package enables
      # `fault-injection` by default, so the production profile is the
      # workspace WITHOUT it; the artifact proof asserts seam payloads are
      # absent there and present under the feature.
      - cargo check --workspace --exclude faktor-tests-fault
      - sh scripts/check-fault-seams.sh
      - cargo check --workspace --all-features
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
      - cargo test --workspace --all-features
      - cargo run -p faktor-cli -- doctor --data-dir /tmp/faktor-ci
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        rustup show active-toolchain
        rustup component add rustfmt clippy
        cargo fmt --check
        cargo check --workspace --exclude faktor-tests-fault
        sh scripts/check-fault-seams.sh
        cargo check --workspace --all-features
        cargo clippy --workspace --all-targets --all-features -- -D warnings
        cargo test --workspace --all-features
        cargo run -p faktor-cli -- doctor --data-dir /tmp/faktor-ci
        CMDS
        )"
        cmds_digest="sha256:$(printf '%s' "$CMDS" | sha256sum | cut -d' ' -f1)"
        cmds_b64="$(printf '%s' "$CMDS" | base64 | tr -d '\n')"
        iso_ts() { t="$1"; if [ -n "$t" ]; then date -u -r "$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ; else date -u +%Y-%m-%dT%H:%M:%SZ; fi; }
        started_at="$(iso_ts "${CI_PIPELINE_STARTED:-}")"
        finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tree="$(git rev-parse 'HEAD^{tree}')"
        artifacts="[]"
        artifact_digest="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        printf '{"schema":"faktor-woodpecker-lane/v2","lane":"linux","status":"passed","commit":"%s","tree":"%s","clean":true,"runner":{"os":"%s","arch":"%s","ci":"woodpecker","run_id":"%s"},"started_at":"%s","finished_at":"%s","commands_b64":"%s","commands_digest":"sha256:%s","artifacts":%s,"artifact_digest":"sha256:%s"}\n' \
          "$CI_COMMIT_SHA" "$tree" "$(uname -s | tr '[:upper:]' '[:lower:]')" "$(uname -m)" "${CI_PIPELINE_NUMBER:-0}" "$started_at" "$finished_at" "$cmds_b64" "$cmds_digest" "$artifacts" "$artifact_digest" > target/certification/lanes/linux.json
  - name: static
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    environment:
      RUST_BACKTRACE: "1"
    commands:
      - cargo test -p faktor-tests-static-authority
      - cargo test -p faktor-security
      - cargo test -p faktor-tests-fuzz-seeds
      - cargo run -p faktor-contracts -- check
      - SUPPLY_CHAIN_BUILD=1 SUPPLY_CHAIN_ARTIFACTS="target/release/faktor-cli" bash scripts/supply-chain.sh
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cargo test -p faktor-tests-static-authority
        cargo test -p faktor-security
        cargo test -p faktor-tests-fuzz-seeds
        cargo run -p faktor-contracts -- check
        SUPPLY_CHAIN_BUILD=1 SUPPLY_CHAIN_ARTIFACTS="target/release/faktor-cli" bash scripts/supply-chain.sh
        CMDS
        )"
        cmds_digest="sha256:$(printf '%s' "$CMDS" | sha256sum | cut -d' ' -f1)"
        cmds_b64="$(printf '%s' "$CMDS" | base64 | tr -d '\n')"
        iso_ts() { t="$1"; if [ -n "$t" ]; then date -u -r "$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ; else date -u +%Y-%m-%dT%H:%M:%SZ; fi; }
        started_at="$(iso_ts "${CI_PIPELINE_STARTED:-}")"
        finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tree="$(git rev-parse 'HEAD^{tree}')"
        artifacts="[]"
        artifact_digest="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        printf '{"schema":"faktor-woodpecker-lane/v2","lane":"static","status":"passed","commit":"%s","tree":"%s","clean":true,"runner":{"os":"%s","arch":"%s","ci":"woodpecker","run_id":"%s"},"started_at":"%s","finished_at":"%s","commands_b64":"%s","commands_digest":"sha256:%s","artifacts":%s,"artifact_digest":"sha256:%s"}\n' \
          "$CI_COMMIT_SHA" "$tree" "$(uname -s | tr '[:upper:]' '[:lower:]')" "$(uname -m)" "${CI_PIPELINE_NUMBER:-0}" "$started_at" "$finished_at" "$cmds_b64" "$cmds_digest" "$artifacts" "$artifact_digest" > target/certification/lanes/static.json
  - name: docs
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ 2026-09-24; rustup baseline only — rust-toolchain.toml is authoritative
    environment:
      RUST_BACKTRACE: "1"
    commands:
      - cargo doc --workspace --all-features --no-deps
      - bash scripts/branding-scan.sh
      - bash scripts/check-docs-sync.sh
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cargo doc --workspace --all-features --no-deps
        bash scripts/branding-scan.sh
        bash scripts/check-docs-sync.sh
        CMDS
        )"
        cmds_digest="sha256:$(printf '%s' "$CMDS" | sha256sum | cut -d' ' -f1)"
        cmds_b64="$(printf '%s' "$CMDS" | base64 | tr -d '\n')"
        iso_ts() { t="$1"; if [ -n "$t" ]; then date -u -r "$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ; else date -u +%Y-%m-%dT%H:%M:%SZ; fi; }
        started_at="$(iso_ts "${CI_PIPELINE_STARTED:-}")"
        finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tree="$(git rev-parse 'HEAD^{tree}')"
        artifacts="[]"
        artifact_digest="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        printf '{"schema":"faktor-woodpecker-lane/v2","lane":"docs","status":"passed","commit":"%s","tree":"%s","clean":true,"runner":{"os":"%s","arch":"%s","ci":"woodpecker","run_id":"%s"},"started_at":"%s","finished_at":"%s","commands_b64":"%s","commands_digest":"sha256:%s","artifacts":%s,"artifact_digest":"sha256:%s"}\n' \
          "$CI_COMMIT_SHA" "$tree" "$(uname -s | tr '[:upper:]' '[:lower:]')" "$(uname -m)" "${CI_PIPELINE_NUMBER:-0}" "$started_at" "$finished_at" "$cmds_b64" "$cmds_digest" "$artifacts" "$artifact_digest" > target/certification/lanes/docs.json
  - name: vscode
    image: node:24@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4 # node:24 @ 2026-09-23
    commands:
      # No apt: the digest-pinned node:24 baseline already ships unzip and
      # ca-certificates (verified: `unzip`, `python3`, curl and
      # /etc/ssl/certs/ca-certificates.crt are present); the stock image is
      # kept because the lane installs nothing.
      - cd apps/vscode
      - npm ci
      - npm run build
      - node scripts/selftest.mjs
      - npx --no-install vsce package --out faktor-ci.vsix
      - node scripts/verify-vsix.mjs faktor-ci.vsix --min-media-files 4
      - rm -rf /tmp/faktor-vsix && mkdir -p /tmp/faktor-vsix && unzip -q faktor-ci.vsix -d /tmp/faktor-vsix
      - node scripts/verify-vsix.mjs faktor-ci.vsix --extract-dir /tmp/faktor-vsix/extension
      - node scripts/selftest.mjs --packaged /tmp/faktor-vsix/extension
      - node scripts/verify-vsix.mjs faktor-ci.vsix --ide-load
      # Artifact branding gate: the packaged VSIX bytes (grep -a over the
      # archive) must carry no legacy wordmark token; the scan exits non-zero
      # on a hit, failing the lane.
      - |
        set -eu
        rm -rf /tmp/faktor-brand-vsix && mkdir -p /tmp/faktor-brand-vsix
        cp faktor-ci.vsix /tmp/faktor-brand-vsix/
        cd "$CI_WORKSPACE"
        bash scripts/branding-scan.sh --artifacts /tmp/faktor-brand-vsix
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cd apps/vscode
        npm ci
        npm run build
        node scripts/selftest.mjs
        npx --no-install vsce package --out faktor-ci.vsix
        node scripts/verify-vsix.mjs faktor-ci.vsix --min-media-files 4
        rm -rf /tmp/faktor-vsix && mkdir -p /tmp/faktor-vsix && unzip -q faktor-ci.vsix -d /tmp/faktor-vsix
        node scripts/verify-vsix.mjs faktor-ci.vsix --extract-dir /tmp/faktor-vsix/extension
        node scripts/selftest.mjs --packaged /tmp/faktor-vsix/extension
        node scripts/verify-vsix.mjs faktor-ci.vsix --ide-load
        set -eu
        rm -rf /tmp/faktor-brand-vsix && mkdir -p /tmp/faktor-brand-vsix
        cp faktor-ci.vsix /tmp/faktor-brand-vsix/
        cd "$CI_WORKSPACE"
        bash scripts/branding-scan.sh --artifacts /tmp/faktor-brand-vsix
        CMDS
        )"
        cmds_digest="sha256:$(printf '%s' "$CMDS" | sha256sum | cut -d' ' -f1)"
        cmds_b64="$(printf '%s' "$CMDS" | base64 | tr -d '\n')"
        iso_ts() { t="$1"; if [ -n "$t" ]; then date -u -r "$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ; else date -u +%Y-%m-%dT%H:%M:%SZ; fi; }
        started_at="$(iso_ts "${CI_PIPELINE_STARTED:-}")"
        finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tree="$(git rev-parse 'HEAD^{tree}')"
        artifact_path="apps/vscode/faktor-ci.vsix"
        artifact_sha="$(sha256sum "$artifact_path" | cut -d' ' -f1)"
        artifacts="[{\"path\":\"$artifact_path\",\"sha256\":\"sha256:$artifact_sha\"}]"
        artifact_digest="$(printf 'sha256:%s\t%s\n' "$artifact_sha" "$artifact_path" | sha256sum | cut -d' ' -f1)"
        printf '{"schema":"faktor-woodpecker-lane/v2","lane":"vscode","status":"passed","commit":"%s","tree":"%s","clean":true,"runner":{"os":"%s","arch":"%s","ci":"woodpecker","run_id":"%s"},"started_at":"%s","finished_at":"%s","commands_b64":"%s","commands_digest":"sha256:%s","artifacts":%s,"artifact_digest":"sha256:%s"}\n' \
          "$CI_COMMIT_SHA" "$tree" "$(uname -s | tr '[:upper:]' '[:lower:]')" "$(uname -m)" "${CI_PIPELINE_NUMBER:-0}" "$started_at" "$finished_at" "$cmds_b64" "$cmds_digest" "$artifacts" "$artifact_digest" > target/certification/lanes/vscode.json
  # Chromium render gate (the PR header used to name it while no lane ran it):
  # builds the extension, then runs the render-webview --check measurements in
  # a real headless Chromium. Image: the SAME digest-pinned Playwright image
  # the trusted `vscode-e2e` lane uses (untested images are refused by
  # `scripts/check-ci-image-pins.sh`; this image needs no volume and no apt).
  # Chrome discovery is deterministic and fail-closed: the image ships
  # chromium under /ms-playwright/chromium-*/chrome-linux/chrome; the lane
  # resolves it with that shell glob, refuses an empty/unusable result, and
  # exports FAKTOR_CHROME (render-webview.mjs honors it). render-webview.mjs
  # has no chrome-flag surface, so a tiny wrapper adds `--no-sandbox` ONLY when
  # the container runs as root — the same root rule scripts/vscode-e2e.sh
  # documents for this image (`id -u` = 0 refuses to start Chrome otherwise).
  - name: vscode-render
    image: mcr.microsoft.com/playwright:v1.55.0-noble@sha256:ffc33305f7b4b04057ae4a0caa70aad4fde87454fb403a1a22e7f931707dfcf9 # linux/amd64 manifest of playwright:v1.55.0-noble (same digest as the trusted vscode-e2e lane; chromium runtime included)
    commands:
      - cd apps/vscode
      - npm ci
      - npm run build
      - |
        set -eu
        chrome_bin=""
        for candidate in /ms-playwright/chromium-*/chrome-linux/chrome; do
          if [ -f "$candidate" ] && [ -x "$candidate" ]; then chrome_bin="$candidate"; break; fi
        done
        if [ -z "$chrome_bin" ]; then
          echo "vscode-render: no chromium under /ms-playwright/chromium-*/chrome-linux/chrome (fail closed)" >&2
          exit 1
        fi
        chrome_wrapper="$(mktemp)"
        if [ "$(id -u)" -eq 0 ]; then
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome_bin" > "$chrome_wrapper"
        else
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$chrome_bin" > "$chrome_wrapper"
        fi
        chmod +x "$chrome_wrapper"
        if [ ! -x "$chrome_wrapper" ]; then
          echo "vscode-render: chrome wrapper $chrome_wrapper unusable (fail closed)" >&2
          exit 1
        fi
        echo "vscode-render: chromium at $chrome_bin (wrapper $chrome_wrapper, uid $(id -u))"
        FAKTOR_CHROME="$chrome_wrapper" node scripts/render-webview.mjs --check
      - cd "$CI_WORKSPACE"
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        cd apps/vscode
        npm ci
        npm run build
        set -eu
        chrome_bin=""
        for candidate in /ms-playwright/chromium-*/chrome-linux/chrome; do
          if [ -f "$candidate" ] && [ -x "$candidate" ]; then chrome_bin="$candidate"; break; fi
        done
        if [ -z "$chrome_bin" ]; then
          echo "vscode-render: no chromium under /ms-playwright/chromium-*/chrome-linux/chrome (fail closed)" >&2
          exit 1
        fi
        chrome_wrapper="$(mktemp)"
        if [ "$(id -u)" -eq 0 ]; then
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome_bin" > "$chrome_wrapper"
        else
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$chrome_bin" > "$chrome_wrapper"
        fi
        chmod +x "$chrome_wrapper"
        if [ ! -x "$chrome_wrapper" ]; then
          echo "vscode-render: chrome wrapper $chrome_wrapper unusable (fail closed)" >&2
          exit 1
        fi
        echo "vscode-render: chromium at $chrome_bin (wrapper $chrome_wrapper, uid $(id -u))"
        FAKTOR_CHROME="$chrome_wrapper" node scripts/render-webview.mjs --check
        cd "$CI_WORKSPACE"
        CMDS
        )"
        cmds_digest="sha256:$(printf '%s' "$CMDS" | sha256sum | cut -d' ' -f1)"
        cmds_b64="$(printf '%s' "$CMDS" | base64 | tr -d '\n')"
        iso_ts() { t="$1"; if [ -n "$t" ]; then date -u -r "$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ; else date -u +%Y-%m-%dT%H:%M:%SZ; fi; }
        started_at="$(iso_ts "${CI_PIPELINE_STARTED:-}")"
        finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tree="$(git rev-parse 'HEAD^{tree}')"
        artifacts="[]"
        artifact_digest="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        printf '{"schema":"faktor-woodpecker-lane/v2","lane":"vscode-render","status":"passed","commit":"%s","tree":"%s","clean":true,"runner":{"os":"%s","arch":"%s","ci":"woodpecker","run_id":"%s"},"started_at":"%s","finished_at":"%s","commands_b64":"%s","commands_digest":"sha256:%s","artifacts":%s,"artifact_digest":"sha256:%s"}\n' \
