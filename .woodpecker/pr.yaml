# Faktor CI — pull_request workflow. UNTRUSTED EVENT: EPHEMERAL STORAGE ONLY.
#
# SECURITY POLICY (audit P1): a pull_request pipeline may be driven by code
# that is not yet reviewed, so this file must never declare `volumes:` and
# must never set CARGO_TARGET_DIR to a named-volume path. Everything a PR
# job writes stays inside the per-pipeline workspace and is discarded when
# the pipeline ends. The trusted caches (`faktor-trusted-*`, mounted only by
# `trusted.yaml`) and the cron caches (`faktor-nightly-*` / `faktor-soak-*`)
# are therefore out of reach of PR code by construction.
#
# Why a separate workflow file instead of an event filter on `trusted.yaml`:
# Woodpecker's trusted/volumes flag is per repository, not per event, so the
# only structural guarantee that a PR can never mount a cache is that the
# workflow file the PR event runs contains no volume declaration at all.
#
# The step set is deliberately reduced: the release `[perf]` budgets (and the
# trusted/platform certificates) belong to `trusted.yaml`; a PR still runs the
# full correctness set (fmt/clippy/check/test/doctor, static+security+fuzz,
# docs-sync, VSIX build+verify, required chromium render gate, JetBrains
# build+smoke) without a warm cache.
#
# Commit-status context (default `WOODPECKER_STATUS_CONTEXT_FORMAT`):
#   ci/woodpecker/pr/pr — this is the context branch protection requires.
#
# Residual risk (documented in scripts/woodpecker/setup.md §5): if the
# repository is marked Trusted (volumes) so the trusted workflow can use
# caches, a PR that edits its own config could add `volumes:` and Woodpecker
# would honor it. Keep "Require approval for forked repositories" enabled
# (the Woodpecker default) and review config edits.

labels:
  platform: linux/amd64

when:
  - event: pull_request

steps:
  # ------------------------------------------------------ storage policy --
  # Fail closed on an accidental regression: the PR workflow itself must not
  # declare a volume. A malicious config can remove this guard, which is why
  # it is only defense-in-depth; the structural guarantee is the absent
  # `volumes:` key plus the documented trust/approval settings.
  - name: storage-policy
    image: alpine:3.20
    commands:
      - |
        set -eu
        if grep -nE '^[[:space:]]*volumes:' .woodpecker/pr.yaml; then
          echo "POLICY VIOLATION: .woodpecker/pr.yaml must not declare volumes (untrusted event)" >&2
          exit 1
        fi
        if grep -vE '^[[:space:]]*#' .woodpecker/pr.yaml | grep -nE 'faktor-(trusted|nightly|soak)-'; then
          echo "POLICY VIOLATION: .woodpecker/pr.yaml must not reference trusted/cron cache volumes" >&2
          exit 1
        fi
        echo "storage policy: PR workflow declares no volumes"

  # ---------------------------------------------------------------- linux --
  - name: linux
    image: rust:1.98
    environment:
      RUST_BACKTRACE: "1"
    commands:
      - apt-get update && apt-get install -y --no-install-recommends python3 procps ca-certificates
      - rustup component add rustfmt clippy
      - cargo fmt --check
      - cargo check --workspace --all-features
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
      - cargo test --workspace --all-features
      - cargo run -p faktor-cli -- doctor --data-dir /tmp/kp-ci
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        apt-get update && apt-get install -y --no-install-recommends python3 procps ca-certificates
        rustup component add rustfmt clippy
        cargo fmt --check
        cargo check --workspace --all-features
        cargo clippy --workspace --all-targets --all-features -- -D warnings
        cargo test --workspace --all-features
        cargo run -p faktor-cli -- doctor --data-dir /tmp/kp-ci
        CMDS
        )"
        cmds_digest="sha256:$(printf '%s' "$CMDS" | sha256sum | cut -d' ' -f1)"
        cmds_b64="$(printf '%s' "$CMDS" | base64 | tr -d '\n')"
        iso_ts() { t="$1"; if [ -n "$t" ]; then date -u -r "$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ; else date -u +%Y-%m-%dT%H:%M:%SZ; fi; }
        started_at="$(iso_ts "${CI_PIPELINE_STARTED:-}")"
        finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tree="$(git rev-parse 'HEAD^{tree}')"
        artifacts="[]"
        artifact_digest="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        printf '{"schema":"faktor-woodpecker-lane/v2","lane":"linux","status":"passed","commit":"%s","tree":"%s","runner":{"os":"%s","arch":"%s","ci":"woodpecker","run_id":"%s"},"started_at":"%s","finished_at":"%s","commands_b64":"%s","commands_digest":"sha256:%s","artifacts":%s,"artifact_digest":"sha256:%s"}\n' \
          "$CI_COMMIT_SHA" "$tree" "$(uname -s | tr '[:upper:]' '[:lower:]')" "$(uname -m)" "${CI_PIPELINE_NUMBER:-0}" "$started_at" "$finished_at" "$cmds_b64" "$cmds_digest" "$artifacts" "$artifact_digest" > target/certification/lanes/linux.json
  # ---------------------------------------------------------- kilo-compat --
  # REQUIRED: the unmodified @kilocode/sdk@7.5.6 client replay against a real
  # daemon. The rust image ships no Node; Node >= 22.15 is installed
  # explicitly. FAKTOR_COMPAT_REQUIRE_NODE=1 makes a missing Node a hard
  # failure (the test also records status=failed in
  # target/certification/kilo-compat.json — never a skip), and the report is
  # asserted below. The step's v2 marker is a dependency of the certificate
  # step, so a missing/failed replay cannot certify. The report status stays
  # `partial` while documented divergences remain; the capabilities manifest
  # reads the same report to keep compat_v756 honest at the exact SHA.
  - name: kilo-compat
    image: rust:1.98
    environment:
      RUST_BACKTRACE: "1"
      FAKTOR_COMPAT_REQUIRE_NODE: "1"
    commands:
      - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gnupg
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y --no-install-recommends nodejs
      - node --version
      - cargo test -p faktor-tests-compat --lib unmodified_upstream_client
      - |
        node -e '
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("target/certification/kilo-compat.json", "utf8"));
          if (report.schema !== "faktor-kilo-compat/v1") throw new Error("kilo-compat report schema " + report.schema);
          if (report.commit !== process.env.CI_COMMIT_SHA) throw new Error("kilo-compat report commit " + report.commit + " != " + process.env.CI_COMMIT_SHA);
          if (report.status !== "passed" && report.status !== "partial") throw new Error("kilo-compat report status " + report.status);
          if (report.status === "passed" && report.responses.passed !== report.responses.total) throw new Error("kilo-compat status/ratio mismatch");
          console.log("kilo-compat: requests " + report.requests.passed + "/" + report.requests.total + ", responses " + report.responses.passed + "/" + report.responses.total + ", divergences " + report.required_divergences + " (" + report.status + ")");
        '
      - |
        set -eu
        mkdir -p target/certification/lanes
        CMDS="$(cat <<'CMDS'
        apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gnupg
        curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y --no-install-recommends nodejs
        node --version
        cargo test -p faktor-tests-compat --lib unmodified_upstream_client
        node -e '
        const fs = require("node:fs");
        const report = JSON.parse(fs.readFileSync("target/certification/kilo-compat.json", "utf8"));
        if (report.schema !== "faktor-kilo-compat/v1") throw new Error("kilo-compat report schema " + report.schema);
        if (report.commit !== process.env.CI_COMMIT_SHA) throw new Error("kilo-compat report commit " + report.commit + " != " + process.env.CI_COMMIT_SHA);
        if (report.status !== "passed" && report.status !== "partial") throw new Error("kilo-compat report status " + report.status);
        if (report.status === "passed" && report.responses.passed !== report.responses.total) throw new Error("kilo-compat status/ratio mismatch");
        console.log("kilo-compat: requests " + report.requests.passed + "/" + report.requests.total + ", responses " + report.responses.passed + "/" + report.responses.total + ", divergences " + report.required_divergences + " (" + report.status + ")");
        '
        CMDS
        )"
        cmds_digest="sha256:$(printf '%s' "$CMDS" | sha256sum | cut -d' ' -f1)"
        cmds_b64="$(printf '%s' "$CMDS" | base64 | tr -d '\n')"
        iso_ts() { t="$1"; if [ -n "$t" ]; then date -u -r "$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$t" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ; else date -u +%Y-%m-%dT%H:%M:%SZ; fi; }
        started_at="$(iso_ts "${CI_PIPELINE_STARTED:-}")"
        finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        tree="$(git rev-parse 'HEAD^{tree}')"
        artifacts="[]"
        artifact_digest="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        printf '{"schema":"faktor-woodpecker-lane/v2","lane":"kilo-compat","status":"passed","commit":"%s","tree":"%s","runner":{"os":"%s","arch":"%s","ci":"woodpecker","run_id":"%s"},"started_at":"%s","finished_at":"%s","commands_b64":"%s","commands_digest":"sha256:%s","artifacts":%s,"artifact_digest":"sha256:%s"}\n' \
          "$CI_COMMIT_SHA" "$tree" "$(uname -s | tr '[:upper:]' '[:lower:]')" "$(uname -m)" "${CI_PIPELINE_NUMBER:-0}" "$started_at" "$finished_at" "$cmds_b64" "$cmds_digest" "$artifacts" "$artifact_digest" > target/certification/lanes/kilo-compat.json
  - name: static
