# Planted violation: the apt-snapshot annotation names a timestamp that does
# not match the snapshot URL actually configured in the step.
# `scripts/check-ci-image-pins.sh --dir` must reject this file.
steps:
  - name: linux
    image: rust:1.98.0@sha256:620dbcd124499c59e2406d3741574b5c5838cf9eb9656f0c3a03948f79b02959 # rust:1.98.0 @ fixture
    commands:
      # apt-snapshot: 20260923T000000Z exact-version pin (fixture, mismatched timestamp)
      - |
        set -eu
        SNAPSHOT=https://snapshot.debian.org/archive/debian/20260915T000000Z
        printf 'deb [check-valid-until=no] %s trixie main\n' "$SNAPSHOT" > /etc/apt/sources.list.d/faktor-snapshot.list
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates=20250419
