org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Explicit bounded Kotlin daemon heap (jetbrains-smoke run-66 OOM class:
# concurrent lane pressure exhausted the compiler JVM). Bounded on purpose;
# the Gradle daemon keeps its own org.gradle.jvmargs above.
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.caching=true
kotlin.code.style=official
kotlin.stdlib.default.dependency=false
org.jetbrains.intellij.platform.intellijPlatformCache=build/intellijPlatform
# HAR-16 (two-IDE-version matrix) — documented project properties:
#   faktor.ideaVersion.pin   the committed default IntelliJ Platform release
#                            (single source of truth; do not change without
#                            re-pinning visual baselines + locks + verification
#                            metadata).
#   faktor.ideaVersion       OPTIONAL explicit release selection
#                            (-Pfaktor.ideaVersion=2024.1 = the documented
#                            older-stable alternate leg). Absent = the pin,
#                            byte-identical behavior. See apps/jetbrains/
#                            README.md "Two IDE versions" and the runner
#                            apps/jetbrains/two-ide-matrix.sh.
#   faktor.ideaVisual        OPTIONAL: "structural" runs the alternate-release
#                            leg without visual digest certification (HAR-16
#                            baseline policy). Refused on the pinned release.
faktor.ideaVersion.pin=2024.1.7
