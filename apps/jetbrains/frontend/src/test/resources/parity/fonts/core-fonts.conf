<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Faktor pinned core-fonts environment for the JetBrains offscreen render.

  The component-tree/state digest derives component bounds from resolved font
  metrics, so the pinned visual baseline is only comparable on the font
  environment it was pinned in. The Faktor CI image installs exactly
  `fontconfig` + `fonts-dejavu-core` (docker/faktor-ci/Dockerfile) and
  `apps/jetbrains/compile-and-smoke.sh` / the Gradle smoke tasks point
  `FONTCONFIG_FILE` at this file so every host resolves the same DejaVu
  family set the Linux record was pinned with. The smoke JVMs also run with a
  checkout-local `user.home`, so the JVM's per-user fontconfig cache can never
  keep a stale (host-default) font mapping.

  Do not add font directories here: adding a font changes the resolved metrics
  and therefore the pinned `environment` fingerprint and digests, which must
  then be re-pinned deliberately with the write-baselines re-pin flow (see
  scripts/windows-visual-baseline.ps1 and the writeBaselines Gradle property).
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
</fontconfig>
