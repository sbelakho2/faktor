[package]
name = "faktor-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Always-on storage governor: one hard aggregate budget, per-class quotas, reserve-before-publish admission, eviction and typed degraded health."

[dependencies]
faktor-core.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
# `fs` exposes safe `statvfs` (the workspace denies unsafe code); `process`
# backs the governor's liveness probe.
rustix = { version = "1.1", features = ["process", "fs"] }

[target.'cfg(windows)'.dependencies]
# Same windows-sys revision the workspace already locks. Capacity is measured
# with GetDiskFreeSpaceExW (the only unsafe wrapper, scoped to that function).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
