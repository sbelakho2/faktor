[package]
name = "faktor-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Manual loopback streaming-delivery harness (ignored by default). Enabling
# it installs a counting global allocator for the lib-test binary only.
streaming-harness = []

[dependencies]
faktor-core.workspace = true
faktor-foundation.workspace = true
faktor-context.workspace = true
faktor-memory.workspace = true
faktor-hooks.workspace = true
faktor-mcp.workspace = true
faktor-browser.workspace = true
zeroize.workspace = true
url = "2"
faktor-protocol.workspace = true
faktor-session.workspace = true
faktor-agent.workspace = true
faktor-orchestrator.workspace = true
faktor-sandbox.workspace = true
faktor-instructions.workspace = true
faktor-provider.workspace = true
faktor-security.workspace = true
faktor-evidence = { path = "../evidence" }
faktor-semantic.workspace = true
faktor-lsp.workspace = true
faktor-pty.workspace = true
# Terminal budget enforcement (cgroup v2 / Job Object limits / rlimits +
# wall watchdog) for the durable terminal authority.
faktor-terminal.workspace = true
faktor-openai.workspace = true
faktor-fs.workspace = true
faktor-edit.workspace = true
faktor-git.workspace = true
faktor-snapshot.workspace = true
faktor-store.workspace = true
faktor-cas.workspace = true
faktor-cloud.workspace = true
faktor-worker.workspace = true
faktor-updater.workspace = true
faktor-scm.workspace = true
axum = { version = "0.8", features = ["ws"] }
# The native/worker listeners drive hyper's connection builder directly so
# HTTP/1 half-close support can be enabled; `axum::serve` exposes no hook for
# it and hyper's default aborts half-closed in-flight requests (see
# `api::lifecycle::serve_with_half_close`).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "service", "tokio"] }
tokio.workspace = true
tower.workspace = true
tower-http = { version = "0.7", features = ["limit"] }
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "http2"] }
tempfile.workspace = true

[dev-dependencies]
rusqlite.workspace = true
faktor-session = { path = "../session", features = ["test-utils"] }
faktor-provider = { workspace = true, features = ["test-utils"] }
# Router tests drive the deterministic crash seams: the orchestrator's
# execution seam vocabulary and the store's crash-arm boundaries.
faktor-orchestrator = { workspace = true, features = ["fault-injection", "test-utils"] }
faktor-store = { workspace = true, features = ["fault-injection"] }
# The updater route tests sign manifests with a real ed25519 key and
# implement the async artifact-fetcher seam.
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
async-trait = "0.1"

[lints]
workspace = true
