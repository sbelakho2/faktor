[package]
name = "faktor-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[dependencies]
faktor-core.workspace = true
faktor-protocol.workspace = true
faktor-security.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "http2"] }
http = "1"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
tempfile.workspace = true
base64 = "0.22"
blake3.workspace = true
zeroize.workspace = true

[features]
# Test-only: exposes the default-allow `PolicyCheckedHttpTransport::permissive`
# constructor to dependent crates' TEST targets (via their dev-dependencies).
# A production build must never enable this: production code receives the
# policy-checked transport injected by the daemon.
test-utils = []

[lints]
workspace = true
