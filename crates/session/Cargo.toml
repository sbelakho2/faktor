[package]
name = "faktor-session"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[dependencies]
faktor-core.workspace = true
faktor-protocol.workspace = true
faktor-store.workspace = true
faktor-cas.workspace = true
faktor-fs.workspace = true
blake3.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true

[features]
# Test-only: exposes the adjustable admission clock to dependent crates.
test-utils = []

[dev-dependencies]
# Unit tests arm the store's deterministic crash seam (recovery windows).
faktor-store = { workspace = true, features = ["fault-injection"] }
# Recovery-band seam tests drive the storage governor the session's own
# store/CAS discover (audit item 14: recovery writes at normal saturation).
faktor-storage.workspace = true
