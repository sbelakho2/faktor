[package]
name = "faktor-impact"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Repository relationship graph and impacted-test authority (one graph for product and CI)"

[dependencies]
faktor-core.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
faktor-terminal.workspace = true
tempfile.workspace = true
faktor-git = { workspace = true, optional = true }
faktor-cas = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
git = ["dep:faktor-git", "dep:faktor-cas", "dep:tokio"]
lsp = ["dep:faktor-cas", "dep:tokio"]
runtime = ["git", "lsp"]

[dev-dependencies]
faktor-cas.workspace = true

[lints]
workspace = true
