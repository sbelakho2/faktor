[package]
name = "faktor-evidence"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Fault-certification seam payloads (EvidenceCrashArm/EvidenceCrashSeam
# arming + panics). OFF in production builds: zero-sized no-op instead.
# Forwards to the CAS seam because evidence fault campaigns also interrupt
# the backing-blob durability boundary.
fault-injection = ["faktor-cas/fault-injection"]

[dependencies]
faktor-core = { path = "../core" }
faktor-store = { path = "../store" }
faktor-cas = { path = "../cas" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[dev-dependencies]
tempfile = "3"
# Unit tests arm the CAS crash seam (backing-blob boundary) directly.
faktor-cas = { path = "../cas", features = ["fault-injection"] }

[lints]
workspace = true
