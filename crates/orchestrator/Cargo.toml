[package]
name = "faktor-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Durable plan model, child control plane, and economic parallelism policy for multi-agent orchestration"

[features]
# Deterministic execution crash seams (CrashSeam / PrOperationCrashPoint).
# OFF in production builds: the seams and their checks are cfg-compiled out.
fault-injection = []

[dependencies]
faktor-core.workspace = true
faktor-session.workspace = true
faktor-agent.workspace = true
faktor-scheduler.workspace = true
faktor-semantic.workspace = true
tracing.workspace = true
faktor-fs.workspace = true
faktor-git.workspace = true
faktor-instructions.workspace = true
faktor-terminal.workspace = true
faktor-scm.workspace = true
# Admission recovery classifies pending claims against the store's durable
# IDs (`PendingAdmission`, `AdmissionResolution`) and resolves them there.
faktor-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
blake3.workspace = true

[dev-dependencies]
faktor-session = { path = "../session", features = ["test-utils"] }
faktor-provider.workspace = true
faktor-cas = { workspace = true, features = ["fault-injection"] }
# The parity waits read the store's ONE terminal-turn-record vocabulary
# (`is_terminal_turn_record_status`) instead of re-spelling `!= "active"`.
# Unit tests also arm the store crash seam (admission crash rows).
faktor-store = { workspace = true, features = ["fault-injection"] }
futures.workspace = true
tempfile.workspace = true
async-trait = "0.1"
# Test-only: the queue settle-path kick computes its decision from a durable
# read; the adversarial test corrupts that read (drops `prompt_queue`) by
# direct SQL against the store file, exactly like the store crate's own
# corruption tests.
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(windows)'.dev-dependencies]
# Same windows-sys 0.61.2 revision the workspace already locks
# (crates/fs, crates/pty, crates/terminal). Used by shadow_tests.rs to
# create the unprivileged directory-junction fallback directly through
# FSCTL_SET_REPARSE_POINT — no child process (spawn authority stays with
# the ProcessSupervisor).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
] }

[lints]
workspace = true
