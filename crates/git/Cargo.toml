[package]
name = "faktor-git"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[dependencies]
faktor-core.workspace = true
faktor-terminal.workspace = true
faktor-cas.workspace = true
faktor-fs.workspace = true
tokio.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Same windows-sys 0.61.2 revision the workspace already locks. The
# pid-reuse-safe process identity needs OpenProcess/GetProcessTimes
# (Win32_System_Threading) plus FILETIME/CloseHandle/GetLastError
# (Win32_Foundation); no other Windows API is used here.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

