[package]
name = "faktor-commerce-connectors"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Faktor Commerce Source site connectors: official-API-first adapters (Mouser, DigiKey, LCSC) and typed follow-up stubs (Alibaba, 1688). No HTTP client, no browser, no model."

[dependencies]
blake3.workspace = true
faktor-commerce.workspace = true
faktor-security.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
async-trait = "0.1"
hmac = "0.12"
sha1 = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# The contract mock recomputes the documented AOP signature from the wire
# bytes, independently of the production signer, and refuses any mismatch.
hmac = "0.12"
sha1 = "0.10"
# Live-canary only (tests/live_canary.rs): the opt-in browser canaries drive
# the real browser authority over an operator's stored logged-in profile.
# The library itself still has no HTTP client and never launches Chromium.
faktor-browser.workspace = true
faktor-cas.workspace = true
faktor-core.workspace = true
faktor-terminal.workspace = true

[lints]
workspace = true
