[package]
name = "faktor-kiwi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
faktor-core = { path = "../core" }
faktor-verify = { path = "../verify" }
faktor-provider = { path = "../provider" }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["time", "macros"] }

[dev-dependencies]
faktor-provider = { path = "../provider", features = ["test-utils"] }
faktor-security = { path = "../security" }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
