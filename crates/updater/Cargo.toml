[package]
name = "faktor-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
faktor-core.workspace = true
faktor-fs.workspace = true
faktor-provider.workspace = true
faktor-cloud.workspace = true
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Test-only: the checked-transport tests build the permissive (no allowlist,
# loopback-address-rule) client behind the test-utils gate.
faktor-provider = { workspace = true, features = ["test-utils"] }
