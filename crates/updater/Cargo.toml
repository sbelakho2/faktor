[package]
name = "faktor-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
faktor-core.workspace = true
faktor-fs.workspace = true
libc = "0.2"
faktor-provider.workspace = true
faktor-cloud.workspace = true
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Test-only: the checked-transport tests build the permissive (no allowlist,
# loopback-address-rule) client behind the test-utils gate.
faktor-provider = { workspace = true, features = ["test-utils"] }

# Same windows-sys 0.61.2 revision the workspace already locks (crates/pty,
# crates/fs, crates/winjob): the Windows launch seam reads the verified file
# object's identity (volume serial + file index + creation time) from its open
# handle through `GetFileInformationByHandle`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
