# The first-run sandbox decision's tamper evidence: HMAC-SHA256 over the
# decision document and the append-only audit chain, keyed by a daemon-local
# 0600 key created on first use (same crates the SCM webhook signer uses).
hmac = "0.12"
sha2 = "0.10"
blake3.workspace = true

[dev-dependencies]
faktor-test-mocks = { path = "../test-mocks" }
faktor-provider = { workspace = true, features = ["test-utils"] }
# Tests drive the deterministic crash seams: store crash-arm boundaries and
# the orchestrator's resume/reattach seam vocabulary.
faktor-store = { workspace = true, features = ["fault-injection"] }
faktor-orchestrator = { workspace = true, features = ["fault-injection", "test-utils"] }
# Test-only: the GitHub App daemon e2e posts signed webhook deliveries to the
# served webhook route and asserts the wire response.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "http2"] }
# Test-only: the worker-transport round-trip binds the same payload digest
# the orchestrator's placement spec mints (BLAKE3 hex).
rusqlite = { version = "0.40", features = ["bundled"] }
# Test-only: the ACP terminal round-trip probes a real pty child's liveness
# with kill(pid, 0) directly. The shell probe it replaced could not
# distinguish ESRCH (gone) from EPERM (exists, not ours) and paid a
# process-spawn per probe under full-suite load.
libc = "0.2"

[lints]
workspace = true
