[package]
name = "faktor-tests-chaos"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["fault-injection"]
# The HAR-04 seam leg arms the deterministic store crash boundaries
# (prompt/session/admission durability points); production builds never
# select this package.
fault-injection = ["faktor-store/fault-injection"]

[dependencies]
faktor-core.workspace = true
faktor-store = { workspace = true, features = ["fault-injection"] }
faktor-session.workspace = true
tokio.workspace = true
serde_json.workspace = true
tempfile.workspace = true
rusqlite.workspace = true

[lints]
workspace = true
