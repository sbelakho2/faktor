# Invariant registry (audit release-program item).
#
# One [[invariant]] table per high-criticality invariant. Field semantics:
#   id                stable identifier, INV-<UPPER-KEBAB>
#   statement         one testable sentence
#   owner             subsystem / crate path that owns the invariant
#   authority         production symbol or module that enforces it
#   unit_test         Rust test fn proving the invariant (crates/** or tests/**)
#   production_wiring Rust test fn proving the production path is wired to it
#   fault             optional #[ignore]-gated [fault] campaign fn ("" = none)
#   mutation_witness  Rust test fn that plants a deliberate violation and
#                     proves the oracle fires; "" for script-level witnesses
#   mutation_command  command that plants a real mutation through
#                     scripts/mutation-run.mjs (spec under scripts/mutations/)
#                     and exits 0 only when the gate detected it; "" only
#                     with a mutation_debt on a downgraded entry
#   mutation_debt     one-line reason no planted-mutation run exists
#                     ("" when mutation_command is set)
#   release_critical  true by default: every invariant in this registry gates
#                     a production authority. A release-critical invariant
#                     MUST ship an executable mutation_command; a non-empty
#                     mutation_debt on it fails BOTH checker modes. An entry
#                     may be downgraded to false ONLY together with a
#                     non-empty criticality_reason, and then debt may remain
#                     as a warning. There are no downgraded entries today.
#   criticality_reason  required one-line justification when
#                     release_critical = false ("" otherwise)
#   platforms         platforms where the invariant must hold
#   script_check      literal non-Rust gate: a VS Code selftest step label
#                     (apps/vscode/scripts/selftest.mjs) or a command line
#                     wired in a .woodpecker workflow. Replaces
#                     unit_test/production_wiring for script-level checks.
#
# scripts/check-invariants.mjs is the gate: every named Rust fn must exist
# exactly once across crates/**+tests/**, every script_check must resolve to
# a selftest step or a wired CI command, every invariant must either ship a
# mutation_command or document the mutation_debt, and no release-critical
# entry may carry debt. `--mutations` runs every mutation_command and proves
# the planted violation is detected by its gate.

