unit_test = "prepared_writer_jobs_never_do_fs_serialization_hashing_sleeps_or_clocks"
production_wiring = "writer_job_allowlist_is_empty"
fault = ""
mutation_witness = "writer_job_scan_fires_on_planted_unprepared_work"
mutation_debt = ""
platforms = ["linux", "macos", "windows"]

[[invariant]]
id = "INV-JOURNAL-INTEGRITY"
statement = "A journal opens only with seq 1 = SessionCreated/Idle, gapless monotonic sequences and non-decreasing timestamps; torn, renumbered, gapped or drifted journals refuse typed on open and in doctor."
owner = "crates/store ledger + crates/session handle"
authority = "crates/store/src/ledger.rs Store::journal_session_problems; crates/session/src/handle.rs SessionHandle::journal_verify_open"
unit_test = "journal_session_problems_flag_each_open_invariant"
production_wiring = "journal_verify_open_maps_a_torn_journal_to_the_typed_corruption_surface"
fault = "full_store_journal_boundaries"
mutation_witness = "journal_consistency_flags_later_event_masquerading_as_seq_one"
mutation_debt = ""
platforms = ["linux", "macos", "windows"]

