authority = "crates/store/src/ledger.rs events_after/events_range/ledger append checked conversions; tests/static-authority/src/lib.rs unchecked_persistence_cast_offenders"
unit_test = "event_page_cursors_and_limits_never_wrap_the_signed_domain"
production_wiring = "ledger_page_limits_refuse_above_the_signed_range"
fault = ""
mutation_witness = "persistence_limits_and_sequences_are_never_cast_unchecked"
mutation_debt = ""
platforms = ["linux", "macos", "windows"]

[[invariant]]
id = "INV-TASK-START-IDEMPOTENT"
statement = "One submission key admits one task: a completed key replays the byte-identical receipt with zero mutations, a pending key refuses in-flight, and a reused key with a different digest is the typed KeyReused."
owner = "crates/store task_admission + crates/orchestrator task_executor"
authority = "crates/store/src/task_admission.rs Store::task_admission_claim; crates/orchestrator/src/task_executor/mod.rs TaskExecutor::start_task"
unit_test = "claim_fresh_then_complete_replays_the_exact_receipt_bytes"
production_wiring = "submission_key_replay_returns_the_byte_identical_receipt_without_a_second_run"
fault = ""
mutation_witness = "same_key_with_a_different_digest_is_key_reused_even_before_completion"
mutation_debt = ""
platforms = ["linux", "macos", "windows"]

[[invariant]]
id = "INV-TRANSCRIPT-SCROLL-OWNERSHIP"
statement = "A background transcript refresh never steals an unpinned reader's position: only the initial load, a pinned view and the user's own submission pin to the bottom."
owner = "apps/vscode webview transcript"
authority = "apps/vscode/media/chat.js renderTranscript/transcriptScrollPlan"
script_check = "background refresh with no transcript delta mutates zero scroll and keeps evidence"
platforms = ["linux", "macos", "windows"]

[[invariant]]
id = "INV-VERIFICATION-CACHE-FRESHNESS"
statement = "No proof/verification cache returns data after its authority key changed: a failed fetch is explicitly unavailable and a stale view is unreachable."
owner = "apps/vscode verification cache"
authority = "apps/vscode/src/taskStart.ts EvidenceAuthorityCache/verificationAuthorityKey; apps/vscode/src/extension.ts taskVerificationFor/taskProofFor"
script_check = "architectural: no proof-like cache returns data after its authority key changed"
platforms = ["linux", "macos", "windows"]

