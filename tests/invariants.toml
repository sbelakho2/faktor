# Invariant registry (audit release-program item).
#
# One [[invariant]] table per high-criticality invariant. Field semantics:
#   id                stable identifier, INV-<UPPER-KEBAB>
#   statement         one testable sentence
#   owner             subsystem / crate path that owns the invariant
#   authority         production symbol or module that enforces it
#   unit_test         Rust test fn proving the invariant (crates/** or tests/**)
#   production_wiring Rust test fn proving the production path is wired to it
#   fault             optional #[ignore]-gated [fault] campaign fn ("" = none)
#   mutation_witness  Rust test fn that plants a deliberate violation and
#                     proves the oracle fires; "" only with a mutation_debt
#   mutation_debt     one-line reason no witness fn exists ("" when set)
#   platforms         platforms where the invariant must hold
#   script_check      literal non-Rust gate: a VS Code selftest step label
#                     (apps/vscode/scripts/selftest.mjs) or a command line
#                     wired in a .woodpecker workflow. Replaces
#                     unit_test/production_wiring for script-level checks.
#
# scripts/check-invariants.mjs is the gate: every named Rust fn must exist
# exactly once across crates/**+tests/**, every script_check must resolve to
# a selftest step or a wired CI command, and every invariant must either name
# a mutation_witness or document the mutation_debt.

[[invariant]]
id = "INV-COMPACTION-SUMMARY-CAP"
statement = "An oversized compaction summary stream is refused whole: the cap is checked before appending, no truncated prefix is ever accepted, and no provenance is captured."
owner = "crates/agent runtime/compaction"
authority = "crates/agent/src/runtime/provider_loop.rs StreamingSummarizer::run (SUMMARY_MAX_CHARS refusal)"
unit_test = "compaction_summary_one_over_the_cap_is_refused"
production_wiring = "try_compact_consumes_durable_projection_not_the_transcript"
fault = ""
mutation_witness = "compaction_cap_guard_is_pinned_against_mutation"
mutation_debt = ""
platforms = ["linux", "macos", "windows"]

