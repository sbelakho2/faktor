fault = ""
mutation_witness = "seed_task_attachments_txn_hostile_task_update_rolls_back_references"
mutation_debt = ""
platforms = ["linux", "macos", "windows"]

[[invariant]]
id = "INV-SHUTDOWN-ZERO-LIVE-AUTHORITIES"
